<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#DACCFF">
<title>ぽよんアリーナ（ためしの版）</title>
<style>
  :root{ --ink:#594236; --dim:#9A8ABC; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html,body{ margin:0; height:100%; overflow:hidden; background:#2A2238;
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",system-ui,sans-serif; color:var(--ink);
    user-select:none; -webkit-user-select:none; touch-action:none }
  #cv{ position:fixed; inset:0; width:100%; height:100% }
  /* 右の親指のボタン。左半分はどこを触っても「動かす」ので、ボタンは置かない */
  .pad{ position:fixed; right:max(14px,env(safe-area-inset-right)); z-index:5;
    width:92px; height:92px; border-radius:50%; border:3px solid #594236;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:14px; font-weight:900; color:#fff; text-shadow:0 2px 0 rgba(89,66,54,.5);
    box-shadow:0 5px 0 rgba(89,66,54,.35); touch-action:none }
  .pad .ic{ font-size:30px; line-height:1 }
  .pad:active,.pad.on{ transform:translateY(3px); box-shadow:0 2px 0 rgba(89,66,54,.35) }
  #jumpBtn{ bottom:calc(132px + env(safe-area-inset-bottom)); background:radial-gradient(circle at 35% 30%,#9FF3F0,#2CB3AD) }
  #atkBtn { bottom:calc(26px + env(safe-area-inset-bottom)); background:radial-gradient(circle at 35% 30%,#FFB27A,#E86A2F) }
  /* レベルアップ・おしまいの 紙 */
  .sheet{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:rgba(28,20,42,.72); backdrop-filter:blur(3px); padding:20px }
  .sheet.show{ display:flex }
  .sheet .inner{ width:100%; max-width:360px; text-align:center }
  .sheet .ttl{ font-size:20px; font-weight:900; color:#FFF3C4; text-shadow:0 2px 0 rgba(0,0,0,.45); margin-bottom:14px }
  .sheet .big{ font-size:26px; font-weight:900; color:#fff; margin:6px 0 }
  .sheet .sub{ font-size:14px; font-weight:800; color:#DACCFF; margin-bottom:18px }
  #cards{ display:flex; flex-direction:column; gap:10px }
  .card{ display:block; width:100%; border:3px solid #594236; border-radius:18px; padding:12px 14px;
    background:linear-gradient(#FFF8EC,#FFE9CF); box-shadow:0 5px 0 rgba(89,66,54,.4);
    text-align:left; font-family:inherit; color:#594236 }
  .card:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(89,66,54,.4) }
  .card .ic{ float:right; font-size:28px; margin-left:8px }
  .card .nm{ font-size:17px; font-weight:900 }
  .card .nt{ font-size:12px; font-weight:700; color:#8A7260; margin-top:2px }
  .go,.again{ display:block; width:100%; margin-top:10px; padding:13px; border-radius:16px; border:3px solid #594236;
    font-family:inherit; font-size:17px; font-weight:900; text-decoration:none; box-shadow:0 5px 0 rgba(89,66,54,.4) }
  .go{ background:linear-gradient(#9FF3F0,#2CB3AD); color:#fff; text-shadow:0 2px 0 rgba(89,66,54,.5) }
  .again{ background:linear-gradient(#FFF8EC,#FFE9CF); color:#594236 }
  #hintPc{ display:none }
  @media (hover:hover) and (pointer:fine){      /* マウスのある画面＝PCのときだけ出す */
    #hint{ display:none }
    #hintPc{ display:block }
  }
  #hint,#hintPc{ position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom)); text-align:center;
    font-size:12px; font-weight:800; color:#F3E6FF; text-shadow:0 2px 0 rgba(0,0,0,.4); z-index:4; pointer-events:none }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="pad" id="jumpBtn" aria-label="とぶ"><span class="ic">⬆</span>とぶ</button>
<button class="pad" id="atkBtn" aria-label="こうげき"><span class="ic">⚔</span>こうげき</button>
<div id="lvup" class="sheet"><div class="inner">
  <div class="ttl" id="lvTitle">レベルアップ！</div>
  <div id="cards"></div>
</div></div>
<div id="winBox" class="sheet"><div class="inner">
  <div class="ttl">ぬしを たおした！</div>
  <div class="big">もちかえった石　<span id="winGot">0</span></div>
  <div class="sub">小屋の ぜんぶで　<span id="winAll">0</span> こ</div>
  <a class="go" href="../index.html">おうちへ もどる</a>
  <button class="again" onclick="location.reload()">もういちど</button>
</div></div>
<div id="hint">画面の左がわを 指でなぞると 左右に動く</div>
<div id="hintPc">PCは　A / D ＝左右　　W か スペース ＝とぶ　　J か X ＝こうげき</div>

<script>
"use strict";
/* =========================================================
   ぽよんアリーナ（ためしの版 v0.1）
   ねらい：横スクロールのまま「左右に動く・跳ぶ・たたかう」の手ざわりを見てもらう。
   本編（ぽよんダンジョン）とは別物。絵だけ本編のものを借りている。
   ========================================================= */
const W = 420;              // 見える横幅（高さは画面に合わせる）
const GROUND = 0.78;        // 地面の位置（画面の高さに対する割合）
const GRAV = 2300, JUMP_V = 760, RUN_A = 2600, RUN_MAX = 300, FRICT = 2000;
const ATK_TIME = 0.22, ATK_CD = 0.3, ATK_RANGE = 86;
/* レベルアップで 変わる数。はじめの値は 上の定数 */
const ST = { range: ATK_RANGE, cd: ATK_CD, run: RUN_MAX, jump: JUMP_V, dmg: 1, pick: 46, hpMax: 5 };
/* ---- 曲の拍（音ゲー好きのゆま向け）----
   敵は拍にあわせて ぴょんと動く。拍ぴったりに こうげきすると つよい。
   外しても ふつうに当たる（損はしない） */
const BPM = 132, SPB = 60 / BPM, JUST = 0.15;
const STEP = 1/120;

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let dpr = 1, scale = 1, H = 700, GY = 500, offX = 0;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = window.innerWidth, ch = window.innerHeight;
  scale = cw / W;
  H = ch / scale;
  GY = H * GROUND;
  offX = 0;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  cv.style.width = cw + "px"; cv.style.height = ch + "px";
}
addEventListener("resize", resize); resize();

/* ---- 絵（本編のものを借りる） ---- */
const IMG = {};
function img(key, src){ const im = new Image(); im.src = "../assets/" + src; IMG[key] = im; return im; }
const ready = im => im && im.complete && im.naturalWidth > 0;
img("slime", "slime_01.png");
for(let i = 0; i < 4; i++) img("run" + i, "run/slime_1_" + i + ".png");
img("bg",    "stage/slime_2.jpg");
img("floor", "stage_obj/slime_2_floor.jpg");
img("bat",   "stage_obj/slime_2_bat.png");
img("rock",  "arena/foe_rock.png");     // 岩の小鬼
img("mush",  "arena/foe_mush.png");     // きのこのおばけ
img("boss",  "arena/boss_golem.png");   // 洞くつのぬし
img("gem",   "prop_01.png");
img("plat",  "stage_obj/slime_2_plat.png");
img("spike", "stage_obj/slime_2_spike1.png");

/* ---- 世界 ----
   道すじは毎回おなじ（覚えてうまくなれるように、でたらめにしない）。
   とげ＝ふむと痛い／台＝上に乗れる・上にクリスタル／穴＝落ちると戻される */
const world = { len: 6000 };
const LEDGES = [], SPIKES = [], PITS = [];
function seeded(a){ a = a >>> 0; return () => { a ^= a << 13; a >>>= 0; a ^= a >>> 17; a ^= a << 5; a >>>= 0; return a / 4294967296; }; }
function buildWorld(){
  const rnd = seeded(20261007);
  let x = 760;                                   // はじめの ひと息ぶんは 何も置かない
  let last = -1;
  while(x < world.len - 420){
    let t = Math.floor(rnd() * 3);
    if(t === last) t = (t + 1) % 3;              // おなじものが 続かないように
    last = t;
    if(t === 0){                                  // 穴
      const w = 88 + Math.floor(rnd() * 52);        // ひと跳びで 越えられる はば
      PITS.push({ x0: x, x1: x + w });
      x += w + 250 + rnd() * 190;
    }else if(t === 1){                            // とげ
      const n = 1 + Math.floor(rnd() * 2);
      for(let i = 0; i < n; i++) SPIKES.push({ x: x + i * 38 });
      x += n * 38 + 240 + rnd() * 190;
    }else{                                        // 台（上にクリスタル3つ）
      const w = 120 + Math.floor(rnd() * 80), top = -(70 + Math.floor(rnd() * 34));   // ひと跳び（125）で届く高さに とどめる
      LEDGES.push({ x0: x, x1: x + w, top });
      for(let i = 0; i < 3; i++) gems.push({ x: x + w / 2 + (i - 1) * 26, y: top - 18, vx: 0, vy: 0, got: false, fixed: true });
      x += w + 236 + rnd() * 190;
    }
  }
}
const inPit = x => PITS.some(q => x > q.x0 && x < q.x1);
const P = { x: 220, y: 0, vx: 0, vy: 0, onGround: true, face: 1, hp: 5, inv: 0, jumps: 0, coy: 0,
            atk: 0, atkCd: 0, anim: 0, squash: 0 };
const foes = [], gems = [], pops = [], parts = [];
const PW = 15;                                   // スライムの 横はば（半分）
let cam = 0, time = 0, killed = 0, picked = 0, spawnT = 1.2;
let paused = false, lv = 1, exp = 0, need = 4, boss = null, over = false;
buildWorld();

/* ---- レベルアップの 3つから ひとつ（ダダサバのあれ） ---- */
const PERKS = [
  { id:"range", ic:"🐾", name:"つめが のびる",   note:"とどく さきが ひろがる", max:5, go:()=> ST.range += 26 },
  { id:"cd",    ic:"⚡", name:"はやく ふれる",   note:"こうげきの 間が みじかく", max:4, go:()=> ST.cd = Math.max(.12, ST.cd - .05) },
  { id:"pick",  ic:"🧲", name:"石が よってくる", note:"はなれていても ひろえる", max:4, go:()=> ST.pick += 34 },
  { id:"hp",    ic:"💗", name:"♥が ふえる",      note:"いっこ ふえて いっこ 回る", max:5, go:()=>{ ST.hpMax++; P.hp = Math.min(ST.hpMax, P.hp + 1); } },
  { id:"run",   ic:"👟", name:"足が はやい",     note:"走る はやさが あがる",   max:4, go:()=> ST.run += 42 },
  { id:"jump",  ic:"🪽", name:"たかく とべる",   note:"ジャンプが のびる",       max:3, go:()=> ST.jump += 55 },
  { id:"dmg",   ic:"💥", name:"一げきが おもい", note:"あたえる ダメージ ＋1",   max:4, go:()=> ST.dmg += 1 },
];
const took = {};
function gainExp(n){
  exp += n;
  while(exp >= need){ exp -= need; lv++; need = 4 + lv * 2; offerPerks(); }
}
function offerPerks(){
  const pool = PERKS.filter(p => (took[p.id] || 0) < p.max);
  const pick = [];
  while(pick.length < 3 && pool.length){ pick.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]); }
  if(!pick.length) return;
  paused = true;
  const box = document.getElementById("cards");
  box.innerHTML = "";
  for(const p of pick){
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<div class="ic">${p.ic}</div><div class="nm">${p.name}</div><div class="nt">${p.note}</div>`;
    b.addEventListener("pointerdown", ev => {
      ev.preventDefault(); ev.stopPropagation();
      p.go(); took[p.id] = (took[p.id] || 0) + 1;
      document.getElementById("lvup").classList.remove("show");
      paused = false;
      sfx(880, .12, "triangle", .08, 1.5);
      pops.push({ x: P.x, y: P.y - 90, t: 0, dx: 0, text: p.name, col: "#2CB3AD" });
    });
    box.appendChild(b);
  }
  document.getElementById("lvTitle").textContent = `レベル ${lv}！ ひとつ えらぶ`;
  document.getElementById("lvup").classList.add("show");
  sfx(520, .2, "triangle", .08, 1.8);
}

/* ---- ボス ---- */
const BOSS_X = 5500;
function spawnBoss(){
  boss = { x: BOSS_X + 240, y: 0, fly: false, boss: true, kind: "boss", hp: 26, hpMax: 26, sp: 48,
           knock: 0, flash: 0, dead: false, t: 0, cast: 2 };
  foes.push(boss);
  pops.push({ x: P.x, y: -120, t: 0, dx: 0, text: "ぬしが きた！", col: "#C0506A" });
  sfx(90, .7, "sawtooth", .12, .5);
}
const BOSS_DROP = 24;
function win(){
  if(over) return;
  over = true;
  const got = picked + BOSS_DROP;                 // 拾ったぶん ＋ ぬしが こぼしたぶん
  picked = got;
  let total = got;
  try{
    const now = JSON.parse(localStorage.getItem("poyon_gems") || "0") || 0;
    total = now + got;
    localStorage.setItem("poyon_gems", JSON.stringify(total));
  }catch(e){}
  setTimeout(() => {                               // 石が ぱーっと 散るのを 見せてから
    document.getElementById("winGot").textContent = got;
    document.getElementById("winAll").textContent = total;
    document.getElementById("winBox").classList.add("show");
    paused = true;
  }, 1300);
}

/* いたい目にあったとき。もどす先は いちばん近い 地面 */
function hurt(pushDir, text){
  if(P.inv > 0) return;
  P.hp--; P.inv = 1.1;
  P.vx = pushDir * 240; P.vy = -300; P.onGround = false;
  sfx(300, .3, "sawtooth", .1, .3);
  pops.push({ x: P.x, y: P.y - 60, t: 0, dx: 0, text: text || "いたっ", col: "#C0506A" });
  if(P.hp <= 0){ P.hp = 5; pops.push({ x: P.x, y: -80, t: 0, dx: 0, text: "ふりだしに もどる", col: "#C0506A" }); }
}
function fellIn(){
  const q = PITS.find(q => P.x > q.x0 && P.x < q.x1);
  P.x = q ? q.x0 - 34 : Math.max(40, P.x - 120);
  P.y = -60; P.vy = 0; P.vx = 0; P.onGround = false;
  P.inv = 0; hurt(-1, "おっこちた！");
}

/* ---- 操作 ---- */
let dragId = null, dragX0 = 0, dragX = 0;
const pressing = { jump: false };
function isLeftHalf(x){ return x < window.innerWidth * 0.55; }
addEventListener("pointerdown", e => {
  if(e.target.closest(".pad")) return;
  if(isLeftHalf(e.clientX)){ dragId = e.pointerId; dragX0 = e.clientX; dragX = e.clientX; }
}, {passive:false});
addEventListener("pointermove", e => { if(e.pointerId === dragId) dragX = e.clientX; });
addEventListener("pointerup",   e => { if(e.pointerId === dragId){ dragId = null; } });
addEventListener("pointercancel", e => { if(e.pointerId === dragId){ dragId = null; } });

function btn(id, down){
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); el.classList.add("on"); down(); });
  el.addEventListener("pointerup",   () => el.classList.remove("on"));
  el.addEventListener("pointerleave",() => el.classList.remove("on"));
}
btn("jumpBtn", () => jump());
btn("atkBtn",  () => attack());
addEventListener("keydown", e => {
  if(e.repeat) return;
  if(e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") jump();
  if(e.code === "KeyX" || e.code === "KeyJ" || e.code === "Enter") attack();
});
const key = {};
const HOLD = ["KeyA", "KeyD", "ArrowLeft", "ArrowRight", "Space", "KeyW", "ArrowUp", "KeyX", "KeyJ"];
addEventListener("keydown", e => {
  if(HOLD.indexOf(e.code) >= 0) e.preventDefault();   // 画面が動いたりボタンが押されたりしないように
  key[e.code] = true;
});
addEventListener("keyup",   e => key[e.code] = false);

function jump(){
  if(P.onGround || P.coy > 0){ P.vy = -ST.jump; P.onGround = false; P.coy = 0; P.jumps = 1; sfx(420, .12, "sine", .1, 1.8); }
  else if(P.jumps === 1){ P.vy = -ST.jump * 0.86; P.jumps = 2; sfx(620, .14, "sine", .09, 1.6); burst(P.x, P.y, 8, "#B8F7F4", 150); }
}
function attack(){
  if(P.atkCd > 0 || paused) return;
  const just = offBeat() < JUST;                     // 拍ぴったり？
  P.atk = ATK_TIME; P.atkCd = ST.cd; P.just = just ? 1 : 0;
  if(just){ sfx(880, .1, "square", .07, 1.6); sfx(1320, .12, "triangle", .05, 1.3); }
  else sfx(260, .08, "sawtooth", .07, .6);
  const reach = ST.range + (just ? 30 : 0), power = ST.dmg * (just ? 2 : 1);
  let hitAny = false;
  for(const f of foes){
    if(f.dead) continue;
    const dx = (f.x - P.x) * P.face, dy = f.y - P.y, rr = (f.boss ? 50 : 0);
    if(dx > -24 - rr && dx < reach + rr && Math.abs(dy) < 70 + rr){ hitFoe(f, power, just); hitAny = true; }
  }
  if(just && hitAny) pops.push({ x: P.x, y: P.y - 86, t: 0, dx: 0, text: "ジャスト！", col: "#2CB3AD" });
}
function hitFoe(f, power, just){
  f.hp -= power; f.knock = P.face * (f.boss ? 50 : 160) * (just ? 1.6 : 1); f.flash = 0.12;
  if(f.hp > 0){
    pops.push({ x: f.x, y: f.y - 40, t: 0, dx: (Math.random() - .5) * 40, text: just ? "ドカッ" : "ぺしっ", col: just ? "#2CB3AD" : "#FFF3C4" });
    return;
  }
  f.dead = true; killed++;
  burst(f.x, f.y - 20, f.boss ? 60 : 16, "#FFD13B", f.boss ? 380 : 230);
  sfx(180, .16, "square", .09, .4);
  if(f.boss){
    for(let i = 0; i < BOSS_DROP; i++) gems.push({ x: f.x + (i % 8 - 4) * 22, y: f.y - 40 - (i / 8 | 0) * 18, vy: -260 - Math.random() * 180, vx: (Math.random() - .5) * 260, got: false });
    win();
    return;
  }
  pops.push({ x: f.x, y: f.y - 30, t: 0, dx: (Math.random() - .5) * 70, text: "やったー！", col: "#E86A2F" });
  for(let i = 0; i < 3; i++) gems.push({ x: f.x + (i - 1) * 14, y: f.y - 30, vy: -220 - i * 30, vx: (i - 1) * 60, got: false });
  gainExp(1);
}

/* ---- 音と拍（その場で作る。小さく、うるさくしない） ---- */
let actx = null, musicT0 = null, schedTo = 0;
function startAudio(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    if(musicT0 === null){ musicT0 = actx.currentTime + 0.12; schedTo = musicT0; }
  }catch(e){}
}
/** いま 何拍目か（小数つき）。音が まだなら 時計で代用 */
function beatNow(){
  if(actx && musicT0 !== null) return (actx.currentTime - musicT0) / SPB;
  return time / SPB;
}
/** 拍から どれだけ ずれているか（0＝ぴったり、0.5＝まんなか） */
function offBeat(){ const b = beatNow(); return Math.abs(b - Math.round(b)); }
const SCALE = [0, 3, 5, 7, 10];                     // 洞くつっぽい 五音
function note(f, t, d, v, type){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "triangle"; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(v, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
}
function kick(t){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
  g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .2);
}
function playBeat(b, t){
  kick(t);
  if(b % 2 === 1) note(2400 + (b % 4) * 200, t, .04, .02, "square");       // うら拍の チッ
  const deg = SCALE[(Math.floor(b / 2) + (b % 8 === 6 ? 2 : 0)) % SCALE.length];
  const f = 220 * Math.pow(2, (deg + (b % 16 >= 8 ? 12 : 0)) / 12);
  note(f, t, .34, .045, "triangle");
  if(b % 8 === 0) note(f / 2, t, .5, .05, "sine");
}
function schedule(){
  if(!actx || musicT0 === null) return;
  const now = actx.currentTime;
  while(schedTo < now + 0.25){
    playBeat(Math.max(0, Math.round((schedTo - musicT0) / SPB)), schedTo);
    schedTo += SPB;
  }
}
function sfx(f, d, type, v, slide){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(f * slide, actx.currentTime + d);
    g.gain.setValueAtTime(v || .08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d + .02);
  }catch(e){}
}
function burst(x, y, n, col, spd){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random() * 0.6);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, life: .5 + Math.random() * .3, r: 2 + Math.random() * 3, col });
  }
}

/* ---- 敵 ---- */
function spawnFoe(){
  const side = Math.random() < 0.75 ? 1 : -1;                       // だいたい前から来る
  const x = P.x + side * (W * 0.7 + Math.random() * 200);
  if(x < 40 || x > world.len - 40) return;
  if(inPit(x)) return;
  const r = Math.random();
  const kind = r < 0.34 ? "bat" : r < 0.67 ? "rock" : "mush";
  const fly = kind === "bat";
  foes.push({ x, y: fly ? -120 - Math.random() * 60 : 0, fly, kind,
              hp: kind === "rock" ? 2 : 1,
              sp: fly ? 70 + Math.random() * 40 : kind === "rock" ? 48 + Math.random() * 24 : 74 + Math.random() * 34,
              knock: 0, flash: 0, dead: false, t: Math.random() * 6 });
}

/* ---- 1コマ進める ---- */
function step(dt){
  time += dt;
  // 左右：指のずれぶんだけ、じわっと加速する
  let want = 0;
  if(dragId !== null) want = Math.max(-1, Math.min(1, (dragX - dragX0) / 55));
  if(key.ArrowLeft  || key.KeyA) want = -1;
  if(key.ArrowRight || key.KeyD) want = 1;
  if(want !== 0){
    P.vx += want * RUN_A * dt;
    P.face = want > 0 ? 1 : -1;
  }else{
    const s = Math.sign(P.vx), d = FRICT * dt;
    P.vx = Math.abs(P.vx) < d ? 0 : P.vx - s * d;
  }
  P.vx = Math.max(-ST.run, Math.min(ST.run, P.vx));
  P.x = Math.max(30, Math.min(world.len - 30, P.x + P.vx * dt));

  // 上下。足もとに 何があるかで 止まる高さが 変わる
  const prevY = P.y;
  P.vy += GRAV * dt; P.y += P.vy * dt;
  let land = null;
  if(P.vy >= 0){
    if(!inPit(P.x) && prevY <= 1 && P.y >= 0) land = 0;
    for(const L of LEDGES){
      if(P.x + PW > L.x0 && P.x - PW < L.x1 && prevY <= L.top + 1 && P.y >= L.top){
        if(land === null || L.top < land) land = L.top;
      }
    }
  }
  if(land !== null){
    if(!P.onGround) P.squash = .12;
    P.y = land; P.vy = 0; P.onGround = true; P.jumps = 0;
  }else{
    P.onGround = false;
    if(P.y > 240){ fellIn(); }
  }
  // とげ
  for(const sp of SPIKES){
    if(Math.abs(P.x - sp.x) < 22 && P.y > -26 && P.y < 30) hurt(Math.sign(P.x - sp.x) || -1, "いたっ");
  }
  P.coy = P.onGround ? 0.09 : Math.max(0, P.coy - dt);   // 台のはしを ふみ外しても ちょっとだけ跳べる
  if(P.atk > 0) P.atk -= dt;
  if(P.atkCd > 0) P.atkCd -= dt;
  if(P.inv > 0) P.inv -= dt;
  if(P.squash > 0) P.squash -= dt;
  P.anim += (Math.abs(P.vx) / ST.run) * dt * 9;

  // 敵
  if(!boss && P.x > BOSS_X - 420) spawnBoss();
  spawnT -= dt;
  if(spawnT <= 0 && !boss && foes.filter(f => !f.dead).length < 7){ spawnFoe(); spawnT = 1.4 + Math.random(); }
  if(boss && !boss.dead){
    boss.cast -= dt;
    if(boss.cast <= 0){                               // 4拍ごとに コウモリを よぶ
      boss.cast = SPB * 8;
      for(let i = -1; i <= 1; i++) foes.push({ x: boss.x - 40, y: -90 + i * 34, fly: true, kind: "bat", hp: 1, sp: 120, knock: 0, flash: 0, dead: false, t: 0 });
      sfx(140, .3, "sawtooth", .08, 1.6);
    }
  }
  const bFrac = beatNow() - Math.floor(beatNow());
  const pulse = bFrac < 0.3 ? 2.5 : 0.22;             // 拍の あたまだけ すすむ
  for(const f of foes){
    if(f.dead) continue;
    f.t += dt;
    if(f.flash > 0) f.flash -= dt;
    const dir = Math.sign(P.x - f.x) || 1;
    if(f.knock){ f.x += f.knock * dt; f.knock *= 0.86; if(Math.abs(f.knock) < 6) f.knock = 0; }
    else f.x += dir * f.sp * pulse * dt;              // 拍の あたまで ぴょんと 出る
    if(!f.fly){                                   // 歩くやつは 穴に落ちる（押しこめば やっつけたことになる）
      if(inPit(f.x) || f.y < 0){
        f.vy = (f.vy || 0) + GRAV * dt; f.y += f.vy * dt;
        if(!inPit(f.x) && f.y >= 0){ f.y = 0; f.vy = 0; }
        if(f.y > 300){ f.dead = true; killed++; pops.push({ x: f.x, y: -40, t: 0, dx: 0, text: "おとした！", col: "#E86A2F" }); continue; }
      }
    }
    if(f.fly) f.y = -110 + Math.sin(beatNow() * Math.PI) * 26 + Math.max(-40, (P.y - (-110)) * 0.15);
    // ぶつかったら
    const dx = f.x - P.x, dy = f.y - P.y;
    if(Math.abs(dx) < 30 && Math.abs(dy) < 46) hurt(-Math.sign(dx) || -1);
  }
  // 光る石
  for(const g of gems){
    if(g.got) continue;
    if(!g.fixed){
      g.vy += GRAV * 0.5 * dt; g.y += g.vy * dt; g.x += (g.vx || 0) * dt; g.vx = (g.vx || 0) * 0.94;
      if(g.y > 0 && !inPit(g.x)){ g.y = 0; g.vy = 0; }
      if(g.y > 400) g.got = true;                 // 穴に落ちた ぶんは あきらめる
    }
    const dx = g.x - P.x, dy = g.y - P.y;
    if(dx * dx + dy * dy < ST.pick * ST.pick){ g.got = true; picked++; sfx(1046, .08, "triangle", .08); sfx(1568, .1, "triangle", .06); }
  }
  // カメラ（真ん中より少し前を見せる）
  const want2 = P.x - W * 0.42 + P.face * 40;
  cam += (want2 - cam) * Math.min(1, dt * 6);
  cam = Math.max(0, Math.min(world.len - W, cam));
}

/* ---- 描く ---- */
function drawBg(){
  const im = IMG.bg;
  ctx.fillStyle = "#2A2238"; ctx.fillRect(0, 0, W, H);
  if(ready(im)){
    const k = (GY + 40) / im.naturalHeight, w = im.naturalWidth * k;
    const x0 = -((cam * 0.4) % (w * 2));
    for(let i = 0; x0 + i * w < W; i++){
      const x = x0 + i * w;
      if(i % 2){ ctx.save(); ctx.translate(x + w, 0); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, w, GY + 40); ctx.restore(); }
      else ctx.drawImage(im, x, 0, w, GY + 40);
    }
  }
  ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(0, 0, W, GY);
}
function drawFloor(){
  const im = IMG.floor;
  if(ready(im)){
    const fh = H - GY + 4, fw = fh * im.naturalWidth / im.naturalHeight;
    const x0 = -((cam * 1) % fw);
    for(let x = x0; x < W; x += fw) ctx.drawImage(im, x, GY - 4, fw, fh);
  }else{
    ctx.fillStyle = "#B08A60"; ctx.fillRect(0, GY, W, H - GY);
  }
  ctx.fillStyle = "rgba(89,66,54,.25)"; ctx.fillRect(0, GY - 3, W, 3);
  // 穴をあける（床の上に 暗いところを かぶせる）
  for(const q of PITS){
    const x0 = q.x0 - cam, x1 = q.x1 - cam;
    if(x1 < -20 || x0 > W + 20) continue;
    const g = ctx.createLinearGradient(0, GY - 6, 0, H);
    g.addColorStop(0, "#1B1426"); g.addColorStop(1, "#0C0812");
    ctx.fillStyle = g; ctx.fillRect(x0, GY - 6, x1 - x0, H - GY + 10);
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x0, GY - 6, x1 - x0, 10);
    ctx.fillStyle = "#6B4F3C";
    ctx.fillRect(x0 - 5, GY - 7, 5, 9); ctx.fillRect(x1, GY - 7, 5, 9);
  }
}
// 台（上に乗れる）
function drawLedges(){
  const im = IMG.plat;
  for(const L of LEDGES){
    const x0 = L.x0 - cam, w = L.x1 - L.x0;
    if(x0 + w < -40 || x0 > W + 40) continue;
    const y = GY + L.top;
    ctx.fillStyle = "rgba(60,36,28,.22)";
    ctx.beginPath(); ctx.ellipse(x0 + w / 2, GY + 2, w * .42, 6, 0, 0, 7); ctx.fill();
    if(ready(im)){
      const h = 44, tw = h * im.naturalWidth / im.naturalHeight;
      for(let x = x0; x < x0 + w; x += tw){
        const cw = Math.min(tw, x0 + w - x);
        ctx.drawImage(im, 0, 0, im.naturalWidth * (cw / tw), im.naturalHeight, x, y - 8, cw, h);
      }
    }else{
      ctx.fillStyle = "#9A7350"; ctx.fillRect(x0, y - 8, w, 20);
    }
  }
}
// とげ（ふむと痛い）
function drawSpikes(){
  const im = IMG.spike;
  for(const sp of SPIKES){
    const x = sp.x - cam;
    if(x < -40 || x > W + 40) continue;
    if(ready(im)){
      const h = 46, w = h * im.naturalWidth / im.naturalHeight;
      ctx.drawImage(im, x - w / 2, GY - h + 4, w, h);
    }else{
      ctx.fillStyle = "#8E7CA8"; ctx.beginPath();
      ctx.moveTo(x - 16, GY); ctx.lineTo(x, GY - 40); ctx.lineTo(x + 16, GY); ctx.fill();
    }
  }
}
function drawSlime(){
  const x = P.x - cam, y = GY + P.y;
  // 影
  ctx.fillStyle = "rgba(60,36,28,.3)";
  const h = Math.max(0, -P.y);
  ctx.beginPath(); ctx.ellipse(x, GY + 2, 22 - Math.min(10, h / 22), 5, 0, 0, 7); ctx.fill();
  if(P.inv > 0 && Math.floor(time * 14) % 2 === 0) return;
  const moving = Math.abs(P.vx) > 20;
  const im = !P.onGround ? IMG.run1 : moving ? IMG["run" + (Math.floor(P.anim) % 4)] : IMG.slime;
  const sq = P.squash > 0 ? 1.18 : 1, sy = P.squash > 0 ? .84 : 1;
  const hh = 58 * sy, w = hh * ((ready(im) ? im.naturalWidth / im.naturalHeight : 1.3)) * sq;
  ctx.save();
  ctx.translate(x, y);
  if(P.face < 0){ ctx.scale(-1, 1); }
  if(ready(im)) ctx.drawImage(im, -w / 2, -hh, w, hh);
  else { ctx.fillStyle = "#42E6E0"; ctx.beginPath(); ctx.ellipse(0, -hh / 2, w / 2, hh / 2, 0, 0, 7); ctx.fill(); }
  ctx.restore();
  // こうげきの軌跡
  if(P.atk > 0){
    const k = 1 - P.atk / ATK_TIME;
    ctx.save(); ctx.globalAlpha = .9 - k * .7;
    ctx.strokeStyle = P.just ? "#8CF6F2" : "#FFF3C4"; ctx.lineCap = "round";
    for(let i = -1; i <= 1; i++){
      ctx.lineWidth = 6 - Math.abs(i) * 2;
      ctx.beginPath();
      ctx.arc(x + P.face * 14, y - 26 + i * 12, 38 + k * 18, P.face > 0 ? -1.0 : Math.PI + 1.0,
              P.face > 0 ? -1.0 + 2.0 * Math.min(1, k * 1.7) : Math.PI + 1.0 - 2.0 * Math.min(1, k * 1.7), P.face < 0);
      ctx.stroke();
    }
    ctx.restore();
  }
}
function drawFoes(){
  for(const f of foes){
    if(f.dead) continue;
    const x = f.x - cam;
    if(x < -80 || x > W + 80) continue;
    const im = IMG[f.kind] || IMG.bat;
    const hh = f.boss ? 128 : f.fly ? 42 : f.kind === "mush" ? 60 : 54;
    const w = hh * ((ready(im) ? im.naturalWidth / im.naturalHeight : 1.2));
    if(!f.fly){ ctx.fillStyle = "rgba(60,36,28,.28)"; ctx.beginPath(); ctx.ellipse(x, GY + 2, w * .4, 5, 0, 0, 7); ctx.fill(); }
    ctx.save();
    if(f.flash > 0){ ctx.filter = "brightness(2.2)"; }
    ctx.translate(x, GY + f.y);
    if(P.x < f.x) ctx.scale(-1, 1);
    if(ready(im)) ctx.drawImage(im, -w / 2, -hh, w, hh);
    else { ctx.fillStyle = "#6E5080"; ctx.fillRect(-16, -hh, 32, hh); }
    ctx.restore();
  }
}
function drawGems(){
  for(const g of gems){
    if(g.got) continue;
    const x = g.x - cam;
    if(x < -30 || x > W + 30) continue;
    const y = GY + g.y - 10 + Math.sin(time * 4 + g.x) * 3;
    const gr = ctx.createRadialGradient(x, y, 2, x, y, 16);
    gr.addColorStop(0, "rgba(180,245,255,.8)"); gr.addColorStop(1, "rgba(180,245,255,0)");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.fill();
    if(ready(IMG.gem)) ctx.drawImage(IMG.gem, x - 11, y - 13, 22, 26);
  }
}
function drawParts(dt){
  for(const p of parts){
    p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x - cam, GY + p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for(let i = parts.length - 1; i >= 0; i--) if(parts[i].t > parts[i].life) parts.splice(i, 1);
}
function drawPops(dt){
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  for(const p of pops){
    p.t += dt;
    p.x += (p.dx || 0) * dt;
    const k = p.t / .8;
    ctx.globalAlpha = Math.max(0, 1 - k);
    ctx.font = `900 ${15 + (1 - k) * 5}px sans-serif`;
    ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(255,255,255,.95)";
    const x = p.x - cam, y = GY + p.y - k * 30;
    ctx.strokeText(p.text, x, y); ctx.fillStyle = p.col; ctx.fillText(p.text, x, y);
  }
  ctx.globalAlpha = 1;
  for(let i = pops.length - 1; i >= 0; i--) if(pops[i].t > .8) pops.splice(i, 1);
}
function drawHud(){
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  const label = (t, x, y, size, col) => {
    ctx.font = `900 ${size}px sans-serif`; ctx.lineWidth = 5; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.strokeText(t, x, y);
    ctx.fillStyle = col; ctx.fillText(t, x, y);
  };
  label("♥".repeat(P.hp) + "♡".repeat(Math.max(0, 5 - P.hp)), 12, 12, 18, "#FF6F9C");
  label(`💎 ${picked}`, 12, 38, 16, "#2E7C9E");
  label(`たおした ${killed}`, 12, 62, 14, "#C98016");
  label(`Lv ${lv}`, 12, 86, 15, "#6B4FA0");
  // 経験の たまり ぐあい
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fillRect(12, 106, 92, 7);
  ctx.fillStyle = "#6B4FA0"; ctx.fillRect(12, 106, 92 * Math.min(1, exp / need), 7);
  ctx.strokeStyle = "rgba(89,66,54,.5)"; ctx.lineWidth = 1.5; ctx.strokeRect(12, 106, 92, 7);

  // 拍の めやす。まるが ぴたっと 小さくなった ときが ぴったり
  const d = offBeat(), k = Math.min(1, d / 0.5), bx = W / 2, by = 30;
  ctx.save();
  ctx.globalAlpha = .9;
  ctx.strokeStyle = d < JUST ? "#2CB3AD" : "rgba(255,255,255,.8)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(bx, by, 11, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(bx, by, 11 + k * 15, 0, 7); ctx.globalAlpha = .5 - k * .4; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = d < JUST ? "#2CB3AD" : "rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.arc(bx, by, 11 - k * 7, 0, 7); ctx.fill();
  ctx.restore();

  // ぬしの 体力
  if(boss && !boss.dead && Math.abs(boss.x - P.x) < 700){
    const w = W - 80, x = 40, y = 54;
    ctx.fillStyle = "rgba(28,20,42,.6)"; ctx.fillRect(x - 2, y - 2, w + 4, 14);
    ctx.fillStyle = "#C0506A"; ctx.fillRect(x, y, w * Math.max(0, boss.hp / boss.hpMax), 10);
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, 10);
    ctx.textAlign = "center"; label("ぬし", W / 2, y + 12, 12, "#FFD9E2"); ctx.textAlign = "left";
  }
}

/* ---- ループ ---- */
let last = performance.now(), acc = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  acc += dt;
  if(paused) acc = 0;
  while(acc >= STEP){ step(STEP); acc -= STEP; }
  schedule();

  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawBg();
  drawFloor();
  drawLedges();
  drawSpikes();
  drawGems();
  drawFoes();
  drawSlime();
  drawParts(dt);
  drawPops(dt);
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 最初の説明は、動かしたら消す
let moved = false;
function hideHint(){
  if(moved) return;
  moved = true;
  setTimeout(() => {
    for(const id of ["hint", "hintPc"]){ const h = document.getElementById(id); if(h) h.style.display = "none"; }
  }, 2500);
}
addEventListener("pointerdown", () => { startAudio(); hideHint(); });
addEventListener("keydown", () => { startAudio(); hideHint(); });
</script>

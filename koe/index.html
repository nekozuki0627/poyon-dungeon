<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#CF7D74">
<title>こえのかわり</title>
<style>
  /* Arilloのローズ #CF7D74 を基調。点線罫線・角丸カード */
  :root{
    --rose:#CF7D74; --rose-d:#B5655D; --ink:#3A3A3A; --dim:#8A7F7C;
    --bg:#FBF6F4; --card:#FFFFFF; --line:#E8D9D5;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#F2EAE8; --dim:#B9A9A5; --bg:#241E1D; --card:#312827; --line:#4A3C3A; color-scheme:dark }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html,body{ margin:0; height:100% }
  body{ background:var(--bg); color:var(--ink); font-size:16px; line-height:1.7;
    font-family:"Hiragino Sans","ヒラギノ角ゴ ProN",system-ui,sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap{ max-width:620px; margin:0 auto; padding:10px 14px calc(104px + env(safe-area-inset-bottom)) }

  /* うかぶ「ばめん」ボタン */
  #fab{ position:fixed; z-index:40; right:14px; bottom:calc(16px + env(safe-area-inset-bottom));
    min-width:92px; padding:10px 16px; border-radius:999px; font-size:14px;
    background:var(--rose); border-color:var(--rose-d); color:#fff;
    box-shadow:0 6px 16px rgba(89,50,45,.3); display:flex; flex-direction:column; align-items:center; gap:1px }
  #fab i{ font-style:normal; font-size:21px; line-height:1.1 }
  #fab b{ font-size:13px; font-weight:800 }
  #scenes{ position:fixed; inset:0; z-index:45; display:none; align-items:flex-end;
    background:rgba(58,40,38,.45) }
  #scenes.on{ display:flex }
  #scenes .sheet{ width:100%; max-width:620px; margin:0 auto; background:var(--bg);
    border-radius:22px 22px 0 0; padding:16px 14px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(0,0,0,.18) }
  .sh-ttl{ font-size:12px; font-weight:800; color:var(--dim); letter-spacing:.1em; margin-bottom:10px;
    text-align:center }
  .sh-close{ width:100%; margin-top:4px; font-size:15px }

  h1{ font-size:17px; font-weight:800; margin:2px 0 8px; color:var(--rose);
    display:flex; align-items:center; gap:8px }
  h1 small{ font-size:12px; font-weight:700; color:var(--dim); margin-left:auto }

  button{ font-family:inherit; font-weight:800; border-radius:13px; border:2px solid var(--line);
    background:var(--card); color:var(--ink); padding:11px 12px; font-size:15px; cursor:pointer }
  button:active{ transform:translateY(2px) }

  /* いちばん上に すえおき */
  #pin{ width:100%; margin-bottom:10px; padding:16px 14px; font-size:17px; line-height:1.5;
    background:var(--rose); border-color:var(--rose-d); color:#fff; text-align:left;
    box-shadow:0 4px 0 rgba(181,101,93,.35) }
  #pin span{ display:block; font-size:11px; font-weight:800; opacity:.85; letter-spacing:.1em; margin-bottom:3px }

  .box{ background:var(--card); border:2px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px }
  textarea{ width:100%; border:none; outline:none; resize:none; background:transparent; color:var(--ink);
    font-family:inherit; font-size:32px; font-weight:600; line-height:1.5; min-height:168px; max-height:46vh;
    padding:6px 6px 2px; overflow-y:auto }
  textarea::placeholder{ color:var(--dim); font-size:20px; font-weight:500 }
  .row{ display:flex; gap:8px; margin-top:6px }
  .go{ flex:1; background:var(--rose); border-color:var(--rose-d); color:#fff; font-size:19px; padding:15px 12px }
  .mini{ padding:11px 14px }

  #sug{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px }
  #sug:empty{ display:none }
  .sg{ border:2px dashed var(--rose); color:var(--rose-d); background:var(--card);
    border-radius:999px; padding:9px 14px; font-size:16px; font-weight:700 }
  @media (prefers-color-scheme: dark){ .sg{ color:#F0B3AC } }

  h2{ font-size:12px; font-weight:800; color:var(--dim); letter-spacing:.1em; margin:18px 0 7px;
    border-bottom:1px dashed var(--line); padding-bottom:5px }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:7px }
  .tile{ text-align:center; padding:13px 6px; font-size:15px; line-height:1.4 }
  .tile.big{ grid-column:1/-1; font-size:16px; padding:14px 10px; border-color:var(--rose); color:var(--rose-d) }
  @media (prefers-color-scheme: dark){ .tile.big{ color:#F0B3AC } }
  .tile .x{ display:inline-block; margin-left:6px; color:var(--dim); font-weight:900 }

  .tabs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; margin-bottom:12px }
  .tab{ font-size:14px; padding:10px 4px; border-radius:14px; line-height:1.3 }
  .tab i{ display:block; font-style:normal; font-size:21px; line-height:1.2; margin-bottom:1px }
  .tab.on{ background:var(--rose); border-color:var(--rose-d); color:#fff }

  .hist{ display:flex; flex-direction:column; gap:6px }
  .hist button{ text-align:left; font-weight:600; font-size:15px; padding:10px 13px }

  .add{ display:flex; gap:7px; margin-top:8px }
  .add[hidden]{ display:none }
  .add input{ flex:1; min-width:0; font-family:inherit; font-size:15px; padding:10px 12px;
    border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink) }

  #show{ position:fixed; inset:0; background:var(--bg); z-index:50; display:none;
    align-items:center; justify-content:center; padding:24px; text-align:center }
  #show.on{ display:flex }
  #showTx{ font-size:clamp(30px,9vw,64px); font-weight:800; line-height:1.45; word-break:break-word }
  #show small{ position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:0; right:0;
    font-size:12px; color:var(--dim); font-weight:700 }

  details{ margin-top:16px; font-size:14px; color:var(--dim) }
  summary{ cursor:pointer; font-weight:800 }
  label{ display:flex; align-items:center; gap:10px; margin:10px 0; font-size:14px }
  input[type=range]{ flex:1; accent-color:var(--rose) }
  select{ font-family:inherit; font-size:14px; padding:7px; border-radius:10px;
    border:2px solid var(--line); background:var(--card); color:var(--ink); max-width:100% }
  .warn{ background:#FFF4E5; border:2px solid #E8C08A; color:#7A5B2A; border-radius:13px;
    padding:10px 12px; font-size:13.5px; margin-bottom:10px }
  @media (prefers-color-scheme: dark){ .warn{ background:#3A2E1C; border-color:#6B5430; color:#F0D9AE } }
</style>
</head>
<body>
<div class="wrap">
  <h1>こえのかわり <small id="st">よみあげ じゅんび中…</small></h1>

  <div id="warn" class="warn" hidden></div>

  <button id="pin"><span>まず これ</span>声の 出しすぎで、声帯が 腫れていて 痛くて 話せません。</button>

  <div class="box">
    <textarea id="tx" rows="4" placeholder="ここに うつ（Enterで 改行できます）" autocomplete="off" autocapitalize="off"></textarea>
    <div class="row">
      <button class="go" id="say">🔊　よむ</button>
      <button class="mini" id="big" title="相手に見せる">👀</button>
      <button class="mini" id="clr">✕</button>
    </div>
  </div>

  <div id="sug"></div>

  <h2 id="sceneTtl">ふだん の ことば</h2>
  <div class="tiles" id="tiles"></div>
  <div class="add" id="addBox" hidden>
    <input id="addTx" placeholder="じぶんの ことばを 足す" autocomplete="off">
    <button id="addGo">＋</button>
  </div>

  <h2>さっき いったこと</h2>
  <div class="hist" id="hist"></div>

  <details>
    <summary>こえの せってい</summary>
    <label>こえ <select id="voice"></select></label>
    <label>はやさ <input type="range" id="rate" min="0.7" max="2" step="0.05" value="1.25"><span id="rateV">1.00</span></label>
    <label>たかさ <input type="range" id="pitch" min="0.6" max="1.6" step="0.05" value="1"><span id="pitchV">1.00</span></label>
    <label><input type="checkbox" id="autoBig"> よむとき じどうで 大きい字にする</label>
    <p><b>Enter</b> は 改行です。よむのは 🔊よむ ボタン（パソコンなら <b>Ctrl+Enter</b> でも）。<br>
    よく使った言葉は 自動で 上のほうに 出てきます。<br>
    「じぶん」のたなで、言いたいことを 足せます（この端末に おぼえます）。</p>
  </details>
</div>

<button id="fab"><i id="fabIc">💬</i><b id="fabTx">ふだん</b></button>
<div id="scenes"><div class="sheet">
  <div class="sh-ttl">ばめんを えらぶ</div>
  <div class="tabs" id="tabs"></div>
  <button class="sh-close" id="shClose">とじる</button>
</div></div>

<div id="show"><div id="showTx"></div><small>画面を タップで もどる</small></div>

<script>

/* ---- おぼえておく（この端末だけ） ---- */
const KEY = "koe_use", HKEY = "koe_hist", SKEY = "koe_set", MKEY = "koe_mine";
let use = {}, hist = [], mine = [], set = { rate: 1.25, pitch: 1, voice: "", autoBig: false };
const load = (k, d) => { try{ return JSON.parse(localStorage.getItem(k) || "null") ?? d; }catch(e){ return d; } };
use = load(KEY, {}); hist = load(HKEY, []); mine = load(MKEY, []);
Object.assign(set, load(SKEY, {}));
if(!(set.rate > 1)) set.rate = 1.25;          // ゆま 10/9「読み上げの速度をあげて」
const save = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const all = () => BANK.concat(mine.map(t => ({ t, y: "", g: "じぶん" })));

/* ---- よみあげ ---- */
let voices = [], ready = false;
function pickVoices(){
  voices = (speechSynthesis.getVoices() || []).filter(v => /^ja/i.test(v.lang));
  if(!voices.length) voices = speechSynthesis.getVoices() || [];
  const sel = $("voice"); sel.innerHTML = "";
  voices.forEach(v => {
    const o = document.createElement("option");
    o.value = v.voiceURI; o.textContent = v.name + (/^ja/i.test(v.lang) ? "" : ` (${v.lang})`);
    sel.appendChild(o);
  });
  if(set.voice && voices.some(v => v.voiceURI === set.voice)) sel.value = set.voice;
  ready = voices.length > 0;
  $("st").textContent = ready ? "よみあげ つかえます" : "こえが 見つかりません";
  if(ready) $("warn").hidden = true;
  else showWarn("この ブラウザでは 声が 見つかりませんでした。Chrome や Safari で ひらくと 読めることが 多いです。大きい字（👀）は そのまま つかえます。");
}
function showWarn(t){ const w = $("warn"); w.textContent = t; w.hidden = false; }
if("speechSynthesis" in window){
  pickVoices();
  speechSynthesis.addEventListener("voiceschanged", pickVoices);
  setTimeout(pickVoices, 600);
}else{
  $("st").textContent = "よみあげ 非対応";
  showWarn("この ブラウザは 読み上げに 対応していません。Chrome で ひらいてください。大きい字（👀）は つかえます。");
}
function speak(text){
  const t = (text || "").trim();
  if(!t) return;
  remember(t);
  if(set.autoBig) bigShow(t);
  if(!("speechSynthesis" in window)){ bigShow(t); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    const v = voices.find(v => v.voiceURI === $("voice").value) || voices[0];
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "ja-JP";
    u.rate = +set.rate; u.pitch = +set.pitch;
    speechSynthesis.speak(u);
  }catch(e){ bigShow(t); }
}
function remember(t){
  use[t] = (use[t] || 0) + 1; save(KEY, use);
  hist = [t, ...hist.filter(x => x !== t)].slice(0, 14); save(HKEY, hist);
  drawHist(); drawTiles();
}

/* ---- 大きい字 ---- */
function bigShow(t){ $("showTx").textContent = t; $("show").classList.add("on"); }
$("show").addEventListener("click", () => $("show").classList.remove("on"));

/* ---- 予測 ---- */
const norm = s => s.replace(/\s/g, "").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function score(p, q){
  const t = norm(p.t), y = norm(p.y), n = use[p.t] || 0;
  if(t.startsWith(q) || (y && y.startsWith(q))) return 100 + n;
  if(t.includes(q) || (y && y.includes(q))) return 50 + n;
  return 0;
}
function drawSug(){
  const q = norm(tx.value), box = $("sug");
  box.innerHTML = "";
  if(!q) return;
  all().map(p => [score(p, q), p]).filter(a => a[0] > 0)
    .sort((a, b) => b[0] - a[0]).slice(0, 8)
    .forEach(([, p]) => {
      const b = document.createElement("button");
      b.className = "sg"; b.textContent = p.t;
      b.addEventListener("click", () => { tx.value = p.t; grow(); drawSug(); speak(p.t); });
      box.appendChild(b);
    });
}
/** 打つほど たてに ひろがる（せますぎた ので） */
function grow(){
  tx.style.height = "auto";
  const max = Math.round(window.innerHeight * 0.46);
  tx.style.height = Math.min(max, Math.max(168, tx.scrollHeight)) + "px";
}
tx.addEventListener("input", () => { grow(); drawSug(); });
addEventListener("resize", grow);
tx.addEventListener("keydown", e => {
  // Enter は ふつうに 改行。よむのは ボタン（いそぐときは Ctrl+Enter）
  if(e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.isComposing){ e.preventDefault(); speak(tx.value); }
});

/* ---- たな ---- */
const GROUPS = [
  ["のど", "🤒"], ["ふだん", "💬"], ["いえ", "🏠"], ["しごと", "💼"],
  ["けいこ", "🎭"], ["びょういん", "🏥"], ["おみせ", "🛒"], ["いどう", "🚗"],
  ["ひと", "🧑"], ["じぶん", "⭐"],
];
let group = "ふだん";
function drawTabs(){
  const box = $("tabs"); box.innerHTML = "";
  for(const [g, ic] of GROUPS){
    const b = document.createElement("button");
    b.className = "tab" + (g === group ? " on" : "");
    b.innerHTML = `<i>${ic}</i>${g}`;
    b.addEventListener("click", () => {
      group = g; drawTabs(); drawTiles(); closeScenes();
      window.scrollTo({ top: Math.max(0, $("sceneTtl").offsetTop - 10), behavior: "smooth" });
    });
    box.appendChild(b);
  }
}
function drawTiles(){
  const ic = (GROUPS.find(a => a[0] === group) || ["", "💬"])[1];
  $("sceneTtl").textContent = group + " の ことば";
  $("fabIc").textContent = ic; $("fabTx").textContent = group;
  const box = $("tiles"); box.innerHTML = "";
  $("addBox").hidden = group !== "じぶん";
  // ならびは あいうえお順（毎回 同じ場所に あるように）。場面の はじめの一文だけ 先頭
  const yomi = p => (p.y || p.t);
  const list = all().filter(p => p.g === group)
    .sort((a, b) => (b.lead ? 1 : 0) - (a.lead ? 1 : 0) || yomi(a).localeCompare(yomi(b), "ja"));
  if(group === "じぶん" && !list.length){
    box.innerHTML = `<div style="color:var(--dim);font-size:14px;grid-column:1/-1">
      まだ ありません。下の らんに 入れて ＋ で ふやせます。</div>`;
  }
  for(const p of list){
    const b = document.createElement("button");
    b.className = "tile" + (p.lead || p.t.length > 13 ? " big" : "");
    b.textContent = p.t;
    b.addEventListener("click", () => speak(p.t));
    if(group === "じぶん"){
      const x = document.createElement("span");
      x.className = "x"; x.textContent = "✕";
      x.addEventListener("click", ev => {
        ev.stopPropagation();
        mine = mine.filter(t => t !== p.t); save(MKEY, mine); drawTiles();
      });
      b.appendChild(x);
    }
    box.appendChild(b);
  }
}
function addMine(){
  const t = $("addTx").value.trim();
  if(!t || mine.indexOf(t) >= 0){ $("addTx").value = ""; return; }
  mine.unshift(t); save(MKEY, mine);
  $("addTx").value = ""; group = "じぶん"; drawTabs(); drawTiles();
}
$("addGo").addEventListener("click", addMine);
$("addTx").addEventListener("keydown", e => { if(e.key === "Enter" && !e.isComposing) addMine(); });

function drawHist(){
  const box = $("hist"); box.innerHTML = "";
  if(!hist.length){ box.innerHTML = `<div style="color:var(--dim);font-size:14px">まだ ありません</div>`; return; }
  for(const t of hist){
    const b = document.createElement("button");
    b.textContent = t;
    b.addEventListener("click", () => speak(t));
    box.appendChild(b);
  }
}

/* ---- ボタン ---- */
$("pin").addEventListener("click", () => speak(PIN));
$("say").addEventListener("click", () => speak(tx.value));
$("big").addEventListener("click", () => { const t = tx.value.trim(); if(t) bigShow(t); });
$("clr").addEventListener("click", () => { tx.value = ""; grow(); drawSug(); tx.focus(); });

/* ---- せってい ---- */
function bind(id, key, out){
  const el = $(id); el.value = set[key];
  const show = () => { if(out) $(out).textContent = (+el.value).toFixed(2); };
  show();
  el.addEventListener("input", () => { set[key] = +el.value; show(); save(SKEY, set); });
}
bind("rate", "rate", "rateV");
bind("pitch", "pitch", "pitchV");
$("voice").addEventListener("change", () => { set.voice = $("voice").value; save(SKEY, set); });
$("autoBig").checked = !!set.autoBig;
$("autoBig").addEventListener("change", () => { set.autoBig = $("autoBig").checked; save(SKEY, set); });

function openScenes(){ $("scenes").classList.add("on"); }
function closeScenes(){ $("scenes").classList.remove("on"); }
$("fab").addEventListener("click", openScenes);
$("shClose").addEventListener("click", closeScenes);
$("scenes").addEventListener("click", e => { if(e.target.id === "scenes") closeScenes(); });

drawTabs(); drawTiles(); drawHist(); grow();
tx.focus();
</script>

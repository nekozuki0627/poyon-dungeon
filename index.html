<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#DACCFF">
<title>ぽよんダンジョン</title>
<style>
:root{
  --ink:#5B4A86;
  --dim:#8A79B5;
  --gold:#C98016;
  --slime:#42E6E0;
  --panel:rgba(255,255,255,.92);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#DACCFF;overscroll-behavior:none;touch-action:none}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;color:var(--ink)}
#cv{display:block;position:fixed;inset:0}
.hide{display:none !important}

.overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;padding-bottom:calc(24px + 56px + env(safe-area-inset-bottom));
  text-align:center;pointer-events:none;
}
#titleView{justify-content:space-between}
@media (max-aspect-ratio: 3/4){
  .overlay:not(#titleView){justify-content:flex-start;padding-top:max(9vh, calc(env(safe-area-inset-top) + 40px))}
  #titleView{padding-top:max(4vh, calc(env(safe-area-inset-top) + 16px))}
}
.logo{
  font-size:clamp(34px,10vw,58px);font-weight:900;letter-spacing:.04em;line-height:1.05;
  color:#42E6E0;-webkit-text-stroke:5px #594236;paint-order:stroke fill;
  text-shadow:0 5px 0 #2CB3AD,0 9px 0 #594236;
}
.logo small{display:block;font-size:.34em;letter-spacing:.3em;color:#7A68A8;text-shadow:none;-webkit-text-stroke:0;margin-top:10px;font-weight:800}
.tap{
  margin-top:30px;font-size:clamp(16px,4.6vw,21px);font-weight:900;color:#594236;
  background:rgba(255,255,255,.75);border-radius:99px;padding:10px 22px;
  animation:blink 1.1s ease-in-out infinite;
}
@keyframes blink{50%{opacity:.35}}
.best-line{margin-top:10px;font-size:13px;color:var(--gold);font-weight:700}

/* ---- おうち（タイトル）---- */
.home-top{display:flex;flex-direction:column;align-items:center}
/* 地面の高さは画面の縦幅で変わるので、canvas 側から --ground をもらって合わせる。
   こうしないと、なまえの札がスライムに重なってしまう */
.home-bottom{
  position:fixed;left:0;right:0;top:var(--ground,60%);bottom:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:6px 16px calc(56px + env(safe-area-inset-bottom));
}
.petname{
  pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.9);border:3px solid #594236;border-radius:99px;
  padding:6px 16px;font-size:18px;font-weight:900;color:#594236;box-shadow:0 4px 0 rgba(89,66,54,.22);
}
.petname small{font-size:11px;color:var(--dim);font-weight:800}
.pettitle{margin-top:5px;font-size:13px;font-weight:800;color:#F3E6FF;text-shadow:0 2px 0 rgba(89,66,54,.55)}
.gemline{
  margin-top:7px;display:inline-block;background:rgba(255,255,255,.88);border-radius:99px;
  padding:4px 16px;font-size:15px;font-weight:900;color:#3E8FB8;border:2px solid #594236;
}
.gemline b{color:#2E7C9E}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:9px}
.btn{
  pointer-events:auto;font-family:inherit;cursor:pointer;font-weight:900;letter-spacing:.03em;
  border:3px solid #594236;border-radius:99px;color:#594236;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(89,66,54,.3) !important}
.btn.go{margin-top:9px;padding:14px 36px;font-size:23px;color:#0F4A48;background:linear-gradient(180deg,#8CF6F2,#3ED8D2);box-shadow:0 6px 0 rgba(89,66,54,.35)}
.btn.sub{padding:11px 20px;font-size:15px;background:linear-gradient(180deg,#FFFFFF,#EFE6FF);box-shadow:0 5px 0 rgba(89,66,54,.28)}
.btn.sub.ready{background:linear-gradient(180deg,#FFE9A8,#F5C24A)}
.btn[disabled]{opacity:.45;pointer-events:none}
.badge{
  display:inline-block;margin-left:6px;background:#FF6B8E;color:#fff;border-radius:99px;
  padding:1px 7px;font-size:11px;border:2px solid #594236;
}

/* ---- そだてる画面 ---- */
#evoView .card{pointer-events:auto;max-height:86vh;overflow:auto}
.evo-now{margin:4px 0 2px;font-size:15px;font-weight:900;color:#594236}
.evo-now span{font-size:12px;color:var(--dim);font-weight:800;margin-left:6px}
.cards{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0 4px}
.ecard{
  pointer-events:auto;cursor:pointer;font-family:inherit;flex:0 0 calc(50% - 4px);min-width:0;
  background:#fff;border:3px solid #594236;border-radius:16px;padding:8px 4px 9px;
  box-shadow:0 5px 0 rgba(89,66,54,.22);display:flex;flex-direction:column;align-items:center;gap:2px;
}
.ecard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(89,66,54,.22)}
.ecard.off{opacity:.5}
.ec-line{font-size:11px;font-weight:900;color:var(--dim);letter-spacing:.06em}
.ec-name{font-size:13px;font-weight:900;color:#594236;line-height:1.2}
.ec-desc{font-size:10px;color:#7A68A8;font-weight:700;line-height:1.35;min-height:4.1em}
.ec-cost{margin-top:2px;font-size:12px;font-weight:900;color:#3E8FB8}
.stars{letter-spacing:2px;font-size:11px;color:#EFAE2B}
/* ---- おはなし（映画の見せ方）----
   遊ぶところはポップなまま、読むところだけ落ち着いた作りにする。
   明朝・レターボックス・字幕・章タイトルのカット。 */
#storyView{padding:0;display:block;background:#000}
.nv-bg{
  position:fixed;inset:0;background:linear-gradient(180deg,var(--bg1,#3A3550),var(--bg2,#14121E));
  transition:background 1.2s ease;
}
.nv-bg::after{                       /* まわりを落として、真ん中に目を寄せる */
  content:"";position:absolute;inset:0;
  background:radial-gradient(115% 62% at 50% 40%, rgba(255,255,255,.10), rgba(0,0,0,.72));
}
.nv-grain{                           /* フィルムの粒子 */
  position:fixed;inset:0;opacity:.12;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>");
}
.nv-bar{position:fixed;left:0;right:0;height:max(7vh,44px);background:#000;z-index:3}
.nv-bar.t{top:0}
.nv-bar.b{bottom:0}
#nvChar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(max(7vh,44px) + 176px);
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));
}
.nv-no{
  position:fixed;top:max(7vh,44px);left:0;right:0;text-align:center;padding-top:12px;z-index:4;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:11px;letter-spacing:.42em;color:rgba(255,255,255,.5);
}
.nv-box{
  position:fixed;left:0;right:0;bottom:max(7vh,44px);z-index:4;
  padding:0 26px 26px;text-align:center;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.72) 46%);
  padding-top:70px;
}
.nv-text{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:17px;line-height:2.0;color:#F3EEE3;min-height:4em;
  text-shadow:0 2px 10px rgba(0,0,0,.9);letter-spacing:.04em;
}
.nv-next{
  margin-top:8px;font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.45);
  animation:blink 1.6s ease-in-out infinite;visibility:hidden;
}
/* 章のあたまに出すタイトル */
.nv-card{
  position:fixed;inset:0;z-index:6;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:#F3EEE3;
  animation:cardin 3.0s ease forwards;pointer-events:none;
}
@keyframes cardin{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0;visibility:hidden}}
.nv-cn{font-size:13px;letter-spacing:.6em;color:rgba(243,238,227,.65)}
.nv-ct{font-size:29px;letter-spacing:.22em;font-weight:600}
.nv-choice{
  pointer-events:auto;position:fixed;left:26px;right:26px;z-index:5;
  bottom:calc(max(7vh,44px) + 150px);
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:400;
  padding:17px 12px;font-size:17px;line-height:1.7;letter-spacing:.06em;
  color:#F3EEE3;background:rgba(10,8,14,.72);border:1px solid rgba(243,238,227,.55);
  border-radius:2px;box-shadow:none;
  animation:fadein 1.6s ease forwards;opacity:0;
}
@keyframes fadein{to{opacity:1}}
.nv-choice:active{transform:none;background:rgba(243,238,227,.16)}
.nv-close{
  pointer-events:auto;position:fixed;left:50%;transform:translateX(-50%);z-index:5;
  bottom:calc(max(7vh,44px) - 32px);padding:6px 18px;font-size:11px;letter-spacing:.2em;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:400;
  color:rgba(255,255,255,.75);background:transparent;border:1px solid rgba(255,255,255,.35);
  border-radius:2px;box-shadow:none;
}
/* 読んでいる間は、広告も音のボタンも引っ込める */
body.cinema #adbar, body.cinema #mute{display:none}
.st-lock{font-size:13px;color:#8A79B5;font-weight:800;line-height:1.8;text-align:center;margin-top:6px}

/* ---- おもいで（読み返し） ---- */
.tabs{display:flex;gap:6px;justify-content:center;margin:10px 0 8px}
.tab{
  pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:900;font-size:12px;
  border:2px solid #594236;border-radius:99px;padding:6px 12px;background:#fff;color:#8A79B5;
}
.tab.on{background:#594236;color:#FFF3D6}
.chap{
  pointer-events:auto;cursor:pointer;font-family:inherit;width:100%;text-align:left;
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
  border:2px solid #594236;border-radius:12px;padding:9px 12px;background:#FFFBF2;
  font-size:13px;font-weight:900;color:#594236;
}
.chap small{color:#B09A78;font-size:11px}
.chap.locked{background:#EFE9F8;color:#A99BC4;border-color:#A99BC4;border-style:dashed}
.chap.buy{background:linear-gradient(180deg,#FFE9A8,#F5C24A);border-color:#594236;color:#5A3A00}
.price{margin-left:auto;font-size:12px;font-weight:900}
.nameinput{
  font-family:inherit;font-size:20px;font-weight:900;text-align:center;color:#594236;
  border:3px solid #594236;border-radius:12px;padding:8px 10px;width:100%;margin:12px 0 4px;
  background:#FFFDF7;pointer-events:auto;
}
#nameView .card{pointer-events:auto}
.howto{margin-top:20px;font-size:13px;line-height:1.9;color:#6B5B90;background:rgba(255,255,255,.62);border-radius:16px;padding:10px 16px}
.howto b{color:#594236}

.card{
  background:var(--panel);border:3px solid #594236;border-radius:24px;
  padding:22px 26px 20px;min-width:min(310px,86vw);box-shadow:0 12px 0 rgba(89,66,54,.25);
}
.r-label{font-size:13px;letter-spacing:.24em;color:var(--dim);font-weight:700}
.r-floor{font-size:clamp(40px,12vw,56px);font-weight:900;line-height:1.1;margin:6px 0 2px}
.r-dist{font-size:18px;font-weight:800;color:#594236}
.r-best{margin-top:10px;font-size:14px;color:var(--dim)}
.r-best b{color:var(--gold)}
.newrec{
  display:inline-block;margin-top:10px;padding:5px 16px;border-radius:99px;font-size:14px;font-weight:900;letter-spacing:.1em;
  color:#5A3A00;background:linear-gradient(180deg,#FFE28E,#F2B53A);border:2px solid #594236;animation:pop .5s cubic-bezier(.2,1.6,.4,1)
}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.r-gap{margin-top:8px;font-size:13px;color:var(--dim)}

.revive{
  pointer-events:auto;margin-top:14px;padding:14px 26px;border-radius:99px;
  font-family:inherit;font-size:17px;font-weight:900;letter-spacing:.04em;cursor:pointer;
  color:#3C2A00;background:linear-gradient(180deg,#FFE08A,#F0AE2B);
  border:3px solid #594236;box-shadow:0 6px 0 rgba(89,66,54,.35);
}
.revive:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(89,66,54,.35)}
.adbox{
  margin:12px 0 6px;padding:26px 18px;border-radius:14px;
  background:#EDE4FF;border:2px dashed #9A8ABC;color:#7A68A8;font-size:13px;font-weight:700;
}
.adcount{margin-top:10px;font-size:34px;font-weight:900;color:#5B4A86}
#adbar{
  position:fixed;left:0;right:0;bottom:0;z-index:4;
  height:calc(56px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:center;justify-content:center;
  background:#EDE4FF;border-top:3px solid #594236;
  color:#9A8ABC;font-size:11px;font-weight:800;letter-spacing:.22em;
}
#mute{
  position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;
  border:2px solid #594236;background:rgba(255,255,255,.8);color:var(--ink);font-size:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="overlay" id="titleView">
  <div class="home-top">
    <div class="logo">ぽよん<br>ダンジョン<small>POYON DUNGEON</small></div>
    <div class="best-line hide" id="titleBest"></div>
  </div>
  <div class="home-bottom">
    <div class="petname" id="petName">ぷに <small>✎</small></div>
    <div class="pettitle" id="petTitle"></div>
    <div class="gemline">💎 もちもの <b id="homeGems">0</b></div>
    <button class="btn go" id="goBtn">▶　もぐる</button>
    <div class="row">
      <button class="btn sub" id="growBtn">そだてる<span class="badge hide" id="growBadge">！</span></button>
      <button class="btn sub" id="bookBtn">おもいで</button>
    </div>
  </div>
</div>

<div class="overlay hide" id="resultView">
  <div class="card">
    <div class="r-label">ここで ちからつきた</div>
    <div class="r-floor" id="rFloor"></div>
    <div class="r-dist" id="rDist"></div>
    <div id="rNew"></div>
    <div class="r-best" id="rBest"></div>
    <div class="r-gap" id="rGap"></div>
    <div class="gemline" id="rGems"></div>
  </div>
  <button class="btn sub ready hide" id="rGrow" style="margin-top:12px">✨ そだてられる！</button>
  <button class="revive hide" id="reviveBtn">▶　広告を見て復活</button>
  <div class="tap" id="rTap" style="visibility:hidden">タップでもう1回</div>
</div>

<!-- 動画広告の場所。いまは仮の画面で、本物の広告は showRewardAd() の中に入れる -->
<div class="overlay hide" id="adView">
  <div class="card" style="text-align:center">
    <div class="r-label">ちょっと待ってね</div>
    <div class="adbox">
      <div>ここに動画広告が入ります</div>
      <div class="adcount"><span id="adCount">5</span></div>
    </div>
    <div class="r-gap">見終わると その場から復活できる</div>
  </div>
</div>

<div class="overlay hide" id="evoView">
  <div class="card" style="min-width:min(336px,93vw)">
    <div class="r-label">そだてる</div>
    <div class="evo-now"><span id="evoName"></span><span id="evoTitle"></span></div>
    <div class="gemline">💎 <b id="evoGems">0</b></div>
    <div class="cards" id="evoCards"></div>
    <div class="r-gap" id="evoNote"></div>
    <button class="btn sub" id="evoBack" style="margin-top:12px">もどる</button>
  </div>
</div>

<div class="overlay hide" id="storyView">
  <div class="nv-bg" id="nvBg"></div>
  <div class="nv-grain"></div>
  <canvas id="nvChar"></canvas>
  <div class="nv-no" id="stNo"></div>
  <div class="nv-box">
    <div class="nv-text" id="stText"></div>
    <div class="nv-next" id="stNext">タップ</div>
  </div>
  <div class="nv-bar t"></div>
  <div class="nv-bar b"></div>
  <div class="nv-card hide" id="nvCard">
    <div class="nv-cn" id="nvCn"></div>
    <div class="nv-ct" id="nvCt"></div>
  </div>
  <button class="btn nv-choice hide" id="stChoice">あの子が不幸になるなんて、ありえない</button>
  <button class="btn nv-close hide" id="stClose">とじる</button>
</div>

<div class="overlay hide" id="bookView">
  <div class="card" style="min-width:min(336px,93vw);pointer-events:auto;max-height:86vh;overflow:auto">
    <div class="r-label">おもいで</div>
    <div class="tabs" id="bookTabs"></div>
    <div id="bookList"></div>
    <button class="btn sub" id="bookBack" style="margin-top:10px">もどる</button>
  </div>
</div>

<!-- 課金の場所。いまは仮の画面で、本物は purchase() の中に入れる -->
<div class="overlay hide" id="shopView">
  <div class="card" style="text-align:center;pointer-events:auto">
    <div class="r-label">すくいの しょう</div>
    <div class="st-title" id="shopTitle" style="text-align:center;margin-top:8px"></div>
    <div class="st-lock" id="shopText"></div>
    <div class="adbox" id="shopBox" style="display:none">
      <div>ここに購入画面が入ります</div>
      <div class="adcount"><span id="shopCount">3</span></div>
    </div>
    <button class="btn sub ready" id="shopBuy" style="margin-top:14px">￥240 で よむ</button>
    <button class="btn sub" id="shopBack" style="margin-top:8px">やめる</button>
  </div>
</div>

<div class="overlay hide" id="nameView">
  <div class="card" style="text-align:center">
    <div class="r-label">なまえを つける</div>
    <input class="nameinput" id="nameInput" maxlength="8" autocomplete="off">
    <button class="btn sub" id="nameOk" style="margin-top:8px">けってい</button>
  </div>
</div>

<div class="overlay hide" id="pauseView">
  <div class="card">
    <div class="r-label">ひとやすみ</div>
    <div class="tap" style="margin-top:14px">タップで再開</div>
  </div>
</div>

<button id="mute" aria-label="音のオン・オフ">🔊</button>

<!-- 画面下にいつも空けておく広告の場所。公開後にここへ広告を入れる -->
<div id="adbar"><span>広告スペース</span></div>

<script>
"use strict";
/* =========================================================
   ぽよんダンジョン
   座標は「地面からの高さ」で計算する（上がマイナス）。
   画面の横幅は論理幅360にそろえるので、スマホでもPCでも先の見え方が同じ。
   ========================================================= */
const W = 360;            // 見える横幅（すべての端末で同じ。スマホ縦持ちで絵が小さくならない幅）
const BAND = 270;         // 遊ぶ帯の高さ
const CEIL = -196;        // 天井の高さ（地面からの距離）
const PX = 84;            // スライムの画面上の横位置
const R = 15;             // スライムの半径
const G = 2300;           // 重力
const JV = 700;           // ジャンプの初速
const JV2 = 620;          // 2段ジャンプの初速
const COYOTE = 0.09;      // 足場を離れてからもジャンプできる猶予
const PX_PER_M = 32;      // 32px = 1m
const FLOOR_M = 50;       // 50mごとに1階層
const STEP = 1/120;       // 物理は固定刻みで回す（端末の速さで結果が変わらないように）

// 横幅を480→360に狭めたぶん速さも0.8倍にし、先が見えてから届くまでの時間を保つ
const speedFor = m => Math.min(352, 172 + m * 0.24);
const gapFor   = m => Math.max(0.55, 1.35 - m * 0.0011);

/* リズム。潜るほど曲が速くなる。
   障害物の間隔は「これまでの最低間隔」を必ず満たしたうえで、八分音符の目に合わせる。
   （間隔は伸びる方向にしか動かないので、抜けられることの検証は保たれる） */
const BPM  = 128;
const BEAT = 60 / BPM;          // 1拍
const GRID = BEAT / 2;          // 八分音符。障害物はこの目にだけ置く
// ジャンプしてから体が一番高くなるまでの時間。
// 「障害物が来る瞬間」ではなく「跳ぶ瞬間」を拍に合わせたいので、この分だけ前倒しする
const JUMP_LEAD = JV / G;

// 走っている速さは進むほど上がる。x から x2 まで進むのにかかる時間
function travelTime(x, x2){
  let t = 0;
  while(x < x2){
    const step = Math.min(8, x2 - x);
    t += step / speedFor(Math.max(0, x - PX) / PX_PER_M);
    x += step;
  }
  return t;
}
// x から dt 秒ぶん進んだ先の位置
function advanceBy(x, dt){
  let t = 0;
  while(t < dt){
    const v = speedFor(Math.max(0, x - PX) / PX_PER_M);
    const step = Math.min(8, (dt - t) * v);
    if(step <= 0) break;
    x += step; t += step / v;
  }
  return x;
}
const tierFor  = m => m < 90 ? 0 : m < 260 ? 1 : m < 520 ? 2 : 3;
const reach    = v => (2 * JV / G) * v;   // 1回のジャンプで進む横の距離

/* ---------------------------------------------------------

   t  = 前の障害物の「終わり」から何秒後に置くか
   wr = 穴の幅を、その速さでの1ジャンプの距離に対する割合で決める
   速さが変わっても、反応に使える時間が変わらないようにするため。
   すべてのまとまりは、抜けられることを自動テストで確かめている。
   --------------------------------------------------------- */

const SIZE = { spike:{w:28,h:22}, spike2:{w:54,h:22}, batLow:{w:0,y:-20}, batHigh:{w:0,y:-72} };
// 天井から下がる岩の下端。低すぎるとスライムの絵がめり込んで「当たっているのに死なない」ように見える
const CEIL_BOTTOM = -70;

/* ---------------------------------------------------------
   1回ぶんの冒険（テストでも同じものを使う）
   --------------------------------------------------------- */
function makeRun(opt = {}){
  return {
    cam: 0, v: 172, obs: [], pits: [], nextX: opt.startX ?? 460, tAt: 0, inv: 0,
    gems: [], magnet: opt.magnet ?? 0,
    fixedV: opt.fixedV ?? null, gen: opt.gen ?? true,
    P: { y:-R, vy:0, onGround:true, jumps:0, coy:0, fallen:false, dead:null },
    ev: [],   // 画面側に伝える出来事（着地・ジャンプなど）
  };
}

// t0 を渡すと、まとまりの中の障害物も一つずつ拍に乗せる（本番用）。
// t0 なしのときは素の間隔のまま置く（検証用。こちらの方が詰まっていて厳しい）
function placeChunk(run, chunk, x0, t0){
  const v = run.fixedV ?? speedFor(x0 / PX_PER_M);
  const snap = (t0 != null);
  let end = x0, tEnd = t0;
  chunk.items.forEach((it, i) => {
    let x;
    if(i === 0){ x = x0; }
    else if(snap){
      const want = tEnd + (it.t || 0);
      const tx = Math.ceil((want - JUMP_LEAD) / GRID) * GRID + JUMP_LEAD;
      x = advanceBy(end, tx - tEnd);
      tEnd = tx;
    }else{
      x = end + (it.t || 0) * v;
    }
    if(it.k === "pit"){
      const w = Math.round(it.wr * reach(v));
      run.pits.push({x0:x, x1:x + w}); end = x + w;
    }else if(it.k === "ceil"){
      run.obs.push({k:"ceil", x, w:it.w}); end = x + it.w;
    }else if(it.k === "batLow" || it.k === "batHigh"){
      run.obs.push({k:"bat", x, y:SIZE[it.k].y}); end = x + 12;
    }else{
      const s = SIZE[it.k];
      run.obs.push({k:"spike", x, w:s.w, h:s.h}); end = x + s.w;
    }
    if(snap) tEnd += travelTime(x, end);
  });
  run._tEnd = tEnd;
  return end;
}

function generate(run){
  const limit = run.cam + W + 400;
  if(!run.tAt) run.tAt = travelTime(PX, run.nextX);   // 走り始めてから最初の障害物に着くまで
  while(run.nextX < limit){
    const m = run.nextX / PX_PER_M;
    const tier = tierFor(m);
    const pool = [];
    CHUNKS.forEach(c => { if(c.tier <= tier){ const w = c.tier === tier ? 3 : 1; for(let i=0;i<w;i++) pool.push(c); } });
    const chunk = pool[Math.floor(Math.random() * pool.length)];
    const end = placeChunk(run, chunk, run.nextX, run.tAt);
    // 次の障害物は「跳ぶ瞬間が拍に乗る」位置に置く。
    // 間隔はこれまでの最低値を必ず満たす方向（切り上げ）にしか動かさない
    const tEnd  = run._tEnd;
    const want  = tEnd + gapFor(m);
    const snapped = Math.ceil((want - JUMP_LEAD) / GRID) * GRID + JUMP_LEAD;
    // クリスタルは「跳べば通る道すじ」に置く。拾うために無理をさせない
    const r = Math.random();
    if(r < 0.60){
      const mid = (run.nextX + end) / 2;
      for(let i = -1; i <= 1; i++) run.gems.push({ x: mid + i * 26, y: i === 0 ? -86 : -64, got: false });
    }else if(r < 0.80){
      run.gems.push({ x: end + 46, y: -R - 10, got: false });
    }
    run.nextX = advanceBy(end, snapped - tEnd);
    run.tAt = snapped;
  }
  // 通り過ぎたものは捨てる
  const cut = run.cam - 100;
  run.obs  = run.obs.filter(o => (o.x + (o.w || 12)) > cut);
  run.pits = run.pits.filter(p => p.x1 > cut);
  run.gems = run.gems.filter(q => !q.got && q.x > cut);
}

const inPit = (run, wx) => run.pits.some(p => wx > p.x0 && wx < p.x1);

function tryJump(run){
  const P = run.P;
  if(P.dead || P.fallen) return 0;
  if(P.onGround || (P.jumps === 0 && P.coy > 0)){
    P.vy = -JV; P.onGround = false; P.jumps = 1; P.coy = 0; run.ev.push("jump"); return 1;
  }
  if(P.jumps < 2){ P.vy = -JV2; P.jumps = 2; run.ev.push("jump2"); return 2; }
  return 0;
}

function circleRect(cx, cy, r, x0, y0, x1, y1){
  const nx = Math.max(x0, Math.min(cx, x1)), ny = Math.max(y0, Math.min(cy, y1));
  return (cx-nx)*(cx-nx) + (cy-ny)*(cy-ny) < r*r;
}

function stepRun(run, dt){
  const P = run.P;
  if(P.dead) return;
  if(run.inv > 0) run.inv -= dt;
  const safe = run.inv > 0;        // 復活直後は当たらない
  const m = run.cam / PX_PER_M;
  run.v = run.fixedV ?? speedFor(m);
  run.cam += run.v * dt;
  if(run.gen) generate(run);

  const wx = run.cam + PX;
  const pit = inPit(run, wx);

  if(P.onGround && pit){ P.onGround = false; P.coy = COYOTE; }
  if(!P.onGround){
    P.coy -= dt;
    P.vy += G * dt;
    P.y  += P.vy * dt;
    if(P.vy >= 0 && P.y >= -R){
      if(!pit && !P.fallen){ P.y = -R; P.vy = 0; P.onGround = true; P.jumps = 0; run.ev.push("land"); }
      else if(P.y > -R + 6){ P.fallen = true; }
    }
    if(!safe && P.fallen && !pit){ P.dead = "pit"; return; }   // 穴の中で壁にぶつかった
    if(!safe && P.y > 70){ P.dead = "pit"; return; }
  }
  if(P.y - R < CEIL){ P.y = CEIL + R; if(P.vy < 0) P.vy = 0; }

  // クリスタル拾い（無敵でも拾える）
  const pr = R + 13 + run.magnet;
  for(const q of run.gems){
    if(q.got || Math.abs(q.x - wx) > pr + 40) continue;
    const dx = q.x - wx, dy = q.y - P.y;
    if(dx * dx + dy * dy < pr * pr){ q.got = true; run.ev.push("gem"); }
  }

  const hr = R * 0.78;   // 当たり判定は見た目より少し小さく（理不尽に感じさせない）
  if(safe) return;
  for(const o of run.obs){
    if(o.x > wx + 60 || (o.x + (o.w || 12)) < wx - 60) continue;
    if(o.k === "spike"){
      if(circleRect(wx, P.y, hr, o.x + 5, -o.h + 7, o.x + o.w - 5, 0)){ P.dead = "spike"; return; }
    }else if(o.k === "ceil"){
      if(circleRect(wx, P.y, hr, o.x, CEIL - 50, o.x + o.w, CEIL_BOTTOM)){ P.dead = "ceil"; return; }
    }else if(o.k === "bat"){
      const by = o.y + Math.sin(o.x * 0.05) * 6;
      const dx = wx - o.x, dy = P.y - by;
      if(dx*dx + dy*dy < (hr + 10) * (hr + 10)){ P.dead = "bat"; return; }
    }
  }
}

function adHeight(){ const el = document.getElementById("adbar"); return el ? el.offsetHeight : 56; }
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = window.innerWidth, ch = Math.max(240, window.innerHeight - adHeight());
  scale = Math.min(cw / W, ch / BAND);
  H = ch / scale;
  offX = (cw - W * scale) / 2;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  cv.style.width = cw + "px"; cv.style.height = ch + "px";
  GY = Math.max(-CEIL, Math.round(H * 0.6));
  bandTop = GY + CEIL;
  // おうちの文字・ボタンを地面の上に置くため、地面の高さを CSS に渡す
  document.documentElement.style.setProperty("--ground", Math.round(GY * scale) + "px");
}

}

/* ---- 音（合成なので音声ファイル不要） ---- */
let actx = null;
function tone(f, d, type="triangle", v=.12, slide=0){
  if(game.muted) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f * slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d);
  }catch(e){}
}
/* ---------------------------------------------------------
   曲。音源ファイルを持たず、その場で合成する（容量ゼロ・権利の心配なし）。
   鳴らす時刻を先に予約して、拍の時刻を覚えておく。その時刻とジャンプの
   ずれを見て PERFECT / GOOD を判定する。
   --------------------------------------------------------- */
const MUSIC = { on:false, next:0, i:0, timer:null, beats:[] };
const SCALE = [0, 3, 5, 7, 10, 12, 10, 7];   // ペンタトニック

let bus = null, echo = null, echoIn = null;
function ensureBus(){
  if(bus || !actx) return;
  bus = actx.createGain(); bus.gain.value = 0.85; bus.connect(actx.destination);
  // 短いこだま。これがないと音がぶつ切りで、走っている気持ちよさが出ない
  echo = actx.createDelay(0.8); echo.delayTime.value = 0.25;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const wet = actx.createGain(); wet.gain.value = 0.34;
  echoIn = actx.createGain(); echoIn.gain.value = 1;
  echoIn.connect(echo); echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(bus);
}
const HZ = n => 261.63 * Math.pow(2, n / 12);   // 0 = ド

function at(freq, t, dur, type, vol, opt = {}){
  if(game.muted || !actx) return;
  ensureBus();
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(opt.slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * opt.slide), t + dur);
  if(opt.detune) o.detune.setValueAtTime(opt.detune, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + (opt.attack || 0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(bus);
  if(opt.echo) g.connect(echoIn);
  o.start(t); o.stop(t + dur + 0.03);
}
function noiseHit(t, vol, hp, dur){
  if(game.muted || !actx) return;
  ensureBus();
  const len = Math.max(256, Math.floor(actx.sampleRate * dur));
  const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const n = actx.createBufferSource(); n.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
  const g = actx.createGain(); g.gain.value = vol;
  n.connect(f); f.connect(g); g.connect(bus);
  n.start(t);
}

/* 明るいポップの定番進行（ド→ソ→ラm→ファ）。
   4小節では短すぎて飽きるので、16小節ひとまわり（約30秒）にしてある。
   地下260mから裏の16小節に切り替わるので、通しで約1分ぶん。 */
const ROOTS  = [0, 7, 9, 5];
const CHORDS = [[0, 4, 7], [-1, 2, 7], [0, 4, 9], [0, 5, 9]];
const BARS = 16;
// 16小節ぶんのメロディ。-1 は休み
const MELODY = [
  [16, -1, 19, -1, 21, -1, 19, -1],
  [16, -1, 14, -1, 16, -1, -1, -1],
  [21, -1, 19, -1, 16, -1, 14, -1],
  [12, -1, 14, -1, 16, -1, -1, -1],

  [19, -1, 21, -1, 23, -1, 21, -1],
  [19, -1, 16, -1, 19, -1, -1, -1],
  [21, 23, 24, -1, 21, -1, 19, -1],
  [16, -1, 19, -1, 21, -1, -1, -1],

  [24, -1, 23, -1, 21, -1, 19, -1],
  [21, -1, 19, -1, 16, -1, -1, -1],
  [14, -1, 16, -1, 19, -1, 21, -1],
  [19, -1, 16, -1, 14, -1, -1, -1],

  [16, 19, 21, -1, 24, -1, 21, -1],
  [23, -1, 21, -1, 19, -1, -1, -1],
  [16, -1, 19, 21, 23, -1, 24, -1],
  [21, -1, 19, -1, 16, -1, -1, -1],
];
// 地下260mから。少し高く、跳ねる感じに
const MELODY_B = [
  [28, -1, 26, -1, 24, -1, 26, -1],
  [28, -1, 31, -1, 28, 26, 24, -1],
  [26, -1, 24, -1, 21, -1, 24, -1],
  [26, 24, 21, -1, 19, -1, -1, -1],

  [24, 26, 28, -1, 31, -1, 28, -1],
  [26, -1, 24, -1, 26, -1, -1, -1],
  [31, -1, 33, -1, 31, 28, 26, -1],
  [28, -1, 26, -1, 24, -1, -1, -1],

  [21, -1, 24, -1, 26, -1, 28, -1],
  [26, -1, 24, -1, 21, -1, -1, -1],
  [28, 31, 33, -1, 36, -1, 33, -1],
  [31, -1, 28, -1, 26, -1, -1, -1],

  [24, -1, 26, 28, 31, -1, 33, -1],
  [31, -1, 28, -1, 26, -1, -1, -1],
  [28, 26, 24, -1, 21, -1, 19, -1],
  [21, -1, 24, -1, 28, -1, -1, -1],
];

function playStep(i, t){
  const bar = Math.floor(i / 8) % BARS, k = i % 8;
  const root = ROOTS[bar % 4];
  const m = game.run ? game.run.cam / PX_PER_M : 0;
  if(echo) echo.delayTime.value = GRID;

  // ドラム
  if(k === 0 || k === 4) at(58, t, 0.17, "sine", 0.3, { slide: 0.42 });
  if(k === 4) noiseHit(t, 0.12, 1400, 0.16);
  noiseHit(t, k % 2 ? 0.045 : 0.03, 7000, 0.035);
  // 4小節ごとの区切りにおかず（フィル）を入れて、同じところを回っている感じを消す
  if(bar % 4 === 3 && k >= 6) noiseHit(t + GRID / 2, 0.1, 900, 0.1);

  // ベース
  if(k === 0 || k === 3 || k === 6) at(HZ(root - 24), t, 0.22, "triangle", 0.16);

  // コード
  if(k % 2 === 1){
    for(const c of CHORDS[bar % 4]) at(HZ(root + c + 12), t, 0.16, "square", 0.024, { attack: 0.004 });
  }

  // メロディ
  const line = (m > 260 ? MELODY_B : MELODY)[bar];
  const n = line[k];
  if(n >= 0){
    at(HZ(n), t, 0.26, "triangle", 0.11, { echo: true, attack: 0.006 });
    at(HZ(n + 12), t, 0.2, "sine", 0.035, { echo: true });
  }
  if(k === 0 && bar % 4 === 0) at(HZ(root + 24), t, 0.5, "sine", 0.03, { echo: true, attack: 0.05 });
}
function musicStart(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; } }
  if(actx.state === "suspended") actx.resume();
  MUSIC.on = true; MUSIC.i = 0; MUSIC.beats.length = 0; MUSIC.next = actx.currentTime + 0.12;
  clearInterval(MUSIC.timer); MUSIC.timer = setInterval(musicSchedule, 30);
}
function musicStop(){ MUSIC.on = false; clearInterval(MUSIC.timer); MUSIC.timer = null; }
function musicSchedule(){
  if(!MUSIC.on || !actx) return;
  while(MUSIC.next < actx.currentTime + 0.3){
    playStep(MUSIC.i, MUSIC.next);
    if(MUSIC.i % 2 === 0){ MUSIC.beats.push(MUSIC.next); if(MUSIC.beats.length > 16) MUSIC.beats.shift(); }
    MUSIC.next += GRID; MUSIC.i++;
  }
}
// いま拍にどれだけ近いか
function judgeBeat(){
  if(!actx || !MUSIC.beats.length) return null;
  const now = actx.currentTime;
  let d = 1e9;
  for(const t of MUSIC.beats) d = Math.min(d, Math.abs(now - t));
  if(d <= 0.085) return "PERFECT";
  if(d <= 0.17)  return "GOOD";
  return null;
}
// 拍の上に乗っているか（画面を脈打たせる用）
function beatPulse(){
  if(!actx || !MUSIC.beats.length) return 0;
  const now = actx.currentTime;
  let d = 1e9;
  for(const t of MUSIC.beats) if(t <= now) d = Math.min(d, now - t);
  return Math.max(0, 1 - d / 0.18);
}

const SFX = {

  floor(){ tone(784, .1); setTimeout(()=>tone(1046, .18), 90); },
  rec(){   [784, 988, 1175, 1568].forEach((f,i) => setTimeout(()=>tone(f, .16), i*90)); },
  gem(){   tone(1046, .09, "triangle", .10); setTimeout(()=>tone(1568, .12, "triangle", .08), 55); },
  pet(){   tone(660, .1, "sine", .1, 1.5); },
  evo(){   [523, 659, 784, 1046, 1318].forEach((f,i) => setTimeout(()=>tone(f, .22, "triangle", .12), i*110)); },

/* ---- 粒 ---- */
function burst(x, y, n, col, spd, up = 0){
  for(let i=0;i<n;i++){
    const a = Math.random() * Math.PI * 2, s = spd * (0.35 + Math.random() * 0.65);
    game.parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - up, life: 0.5 + Math.random()*0.5, t:0, col, r: 2 + Math.random()*3 });
  }
}

function start(){
  game.mode = "play"; game.ui = null;
  game.runGems = 0;
  game.run = makeRun({ magnet: perk("magnet") });
  game.parts = []; game.pops = []; game.shake = 0; game.lastFloor = 1; game.floorFlash = 0;
  game.combo = 0; game.bestCombo = 0; game.bonus = 0; game.revived = false; game.passedDeath = false;
  musicStart();
  game.prevBest = game.best;

}
const floorOf = m => Math.floor(m / FLOOR_M) + 1;

function die(){
  const run = game.run, m = run.cam / PX_PER_M;
  const score = Math.floor(m) + game.bonus;
  // 拾ったクリスタルを持ち帰る（系統によっては多めに持てる）
  const earned = Math.round(game.runGems * perk("gem"));
  pet.gems += earned; pet.total += earned; savePet();
  game.lastDeath = m; store.set("poyon_lastdeath_m", m);   // つぎに来たとき、ここが目印になる
  if(m > game.bestDist){ game.bestDist = m; store.set("poyon_bestdist_m", m); }
  game.mode = "dead"; game.deadAt = game.time; game.shake = 12; game.combo = 0;
  musicStop();
  burst(PX, GY + run.P.y, 30, "#42E6E0", 260, 60);
  SFX.dead();
  try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
  const isNew = score > game.best;
  if(isNew){ game.best = score; store.set("poyon_best_m", score); }
  setTimeout(() => {
    if(game.mode !== "dead") return;
    $("rFloor").textContent = `地下 ${floorOf(m)} 階`;
    $("rDist").innerHTML = `${Math.floor(m)} m ${game.bonus ? `<span style="color:#C98016">＋ リズム ${game.bonus}</span>` : ""}
      <div style="font-size:15px;margin-top:4px">合計 <b style="font-size:22px">${score}</b>${game.bestCombo >= 2 ? `　最高 ${game.bestCombo} コンボ` : ""}</div>`;
    $("rNew").innerHTML = isNew && game.prevBest > 0 ? `<span class="newrec">NEW RECORD</span>` : "";
    $("rBest").innerHTML = `ベスト <b>${Math.floor(game.best)}</b>`;
    const gap = Math.floor(game.best - score);
    $("rGap").textContent = (!isNew && gap > 0 ? `ベストまで あと ${gap}` : "") + (game.revived ? "　（復活を使った）" : "");
    $("rGems").innerHTML = `💎 ＋${earned}${earned > game.runGems ? `<span style="font-size:11px;color:#C98016">（${game.runGems}＋おまけ）</span>` : ""}　もちもの <b>${pet.gems}</b>`;
    $("rGrow").classList.toggle("hide", !canEvolve());
    $("reviveBtn").classList.toggle("hide", game.revived);
    $("resultView").classList.remove("hide");
    $("rTap").style.visibility = "hidden";
    if(isNew && game.prevBest > 0) SFX.rec();
    setTimeout(() => { if(game.mode === "dead") $("rTap").style.visibility = "visible"; }, 450);
  }, 650);
}

/* 動画広告。いまは仮の画面（5秒数えて閉じる）。
   本物を入れるときは、この中で広告を出して、見終わったら done() を呼ぶだけでよい。
   アプリ版は AdMob のリワード広告、ブラウザ版は AdSense などを想定。 */
function showRewardAd(done){
  const v = $("adView");
  $("resultView").classList.add("hide");
  v.classList.remove("hide");
  let left = 5;
  $("adCount").textContent = left;
  const t = setInterval(() => {
    left--;
    $("adCount").textContent = Math.max(0, left);
    if(left <= 0){ clearInterval(t); v.classList.add("hide"); done(); }
  }, 1000);
}

function revive(){
  const run = game.run;
  game.revived = true;
  // 目の前を片づける。復活した瞬間にまたぶつかると、広告を見た意味がなくなる
  const from = run.cam - 60, to = run.cam + W + 280;
  run.obs  = run.obs.filter(o => (o.x + (o.w || 12)) < from || o.x > to);
  run.pits = run.pits.filter(q => q.x1 < from || q.x0 > to);
  if(run.nextX < to){ run.nextX = to; run.tAt = travelTime(PX, run.nextX); }
  Object.assign(run.P, { y:-R, vy:0, onGround:true, jumps:0, coy:0, fallen:false, dead:null });
  run.inv = 1.6;                    // しばらく無敵
  game.combo = 0; game.parts = []; game.pops = [];
  game.shake = 0; game.mode = "play";
  burst(PX, GY, 18, "#FFD13B", 200, 60);
  SFX.floor();
  musicStart();
}

function openEvo(){
  game.ui = "evo";
  $("resultView").classList.add("hide");
  $("evoName").textContent = pet.name;
  $("evoTitle").textContent = `／ ${formName(pet)}（第${pet.stage}段階）`;
  $("evoGems").textContent = pet.gems;
  const box = $("evoCards"); box.innerHTML = "";
  if(pet.stage >= 5){
    $("evoNote").textContent = "これ以上は進化できない。もう立派なものだ。";
  }else{
    const next = pet.stage + 1, cost = EVO_COST[next], ok = pet.gems >= cost;
    $("evoNote").textContent = ok ? "どの姿になるかは、きみが決めていい" : `あと 💎${cost - pet.gems} で進化できる`;
    for(const line of LINES){
      const info = LINE_INFO[line];
      const el = document.createElement("button");
      el.className = "ecard" + (ok ? "" : " off");
      el.appendChild(formThumb(line, next, 82));
      el.insertAdjacentHTML("beforeend",
        `<div class="ec-line">${info.label}</div>
         <div class="ec-name">${info.names[next - 1]}</div>
         <div class="ec-desc">${info.desc}</div>
         <div class="ec-cost">💎 ${cost}</div>`);
      el.addEventListener("pointerdown", ev => { ev.stopPropagation(); ev.preventDefault(); doEvolve(line); });
      box.appendChild(el);
    }
  }
  $("evoView").classList.remove("hide");
}
function closeEvo(){ game.ui = null; $("evoView").classList.add("hide"); }

function doEvolve(line){
  if(pet.stage >= 5) return;
  const next = pet.stage + 1, cost = EVO_COST[next];
  if(pet.gems < cost) return;
  pet.gems -= cost; pet.line = line; pet.stage = next; savePet();
  unlockStory(skey(line), next);
  closeEvo();
  if(game.mode !== "title") showTitle();
  refreshHome();
  game.evoT = 1.1; game.petHappy = 1.6;
  SFX.evo();
  burst(W / 2, GY - 40, 46, "#FFE9A8", 280, 110);
  setTimeout(() => { if(game.mode === "title" && !game.ui) openStory(skey(line), next); }, 900);
}

let stTimer = null;
const SAD = [[9, 12, 16], [5, 9, 12], [0, 4, 7], [7, 11, 14]];   // Am → F → C → G
function storyMusic(on){
  clearInterval(stTimer); stTimer = null;
  if(!on) return;
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; } }
  if(actx.state === "suspended") actx.resume();

}

  $("stText").textContent = ""; $("stNext").style.visibility = "hidden";
  const bg = NV_BG[n === 1 ? "rain" : n === 5 ? "night" : n === 0 ? "dawn" : "home"];
  $("nvBg").style.setProperty("--bg1", bg[0]);
  $("nvBg").style.setProperty("--bg2", bg[1]);
  document.body.classList.add("cinema");
  storyMusic(true);
  $("storyView").classList.remove("hide");
  nvStand();
  // 章のタイトルを一枚はさむ（映画のあれ）
  const card = $("nvCard");
  $("nvCn").textContent = no; $("nvCt").textContent = d.t;
  card.classList.remove("hide");
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  NV.lock = true;
  setTimeout(() => {
    card.classList.add("hide"); NV.lock = false;
    if(game.ui === "story") nvLine();
  }, 3000);
}
// 立ち絵。その章の段階の姿で、ゆっくり呼吸させる
function nvStand(){
  const c = $("nvChar"), g = c.getContext("2d");
  const size = Math.min(210, Math.round(window.innerWidth * 0.55));
  const d = Math.min(2, window.devicePixelRatio || 1);
  c.width = size * d; c.height = size * d;
  c.style.width = size + "px"; c.style.height = size + "px";
  g.scale(d, d);
  const line = NV.key === "human"
    ? (pet.line.indexOf("human") === 0 ? pet.line : "human_f")
    : NV.key;
  const stage = NV.n === 0 ? 5 : NV.n;
  cancelAnimationFrame(NV.raf);
  const loop = () => {
    const t = performance.now() / 1000;
    NV.alpha += (NV.want - NV.alpha) * 0.04;
    g.clearRect(0, 0, size, size);
    g.globalAlpha = Math.max(0, Math.min(1, NV.alpha));
    g.filter = "saturate(.78) brightness(.86) contrast(1.05)";   // 場の色になじませる
    const k = Math.abs(Math.sin(t / 0.95 * Math.PI));
    drawCreature(g, { line, stage }, size / 2, size * 0.95 - k * 3, size * 0.40,
                 { im: IMG.s1, t, sx: 1 + (1 - k) * 0.05, sy: 1 - (1 - k) * 0.05 });
    g.filter = "none"; g.globalAlpha = 1;
    NV.raf = requestAnimationFrame(loop);
  };
  loop();
}
function nvLine(){
  const text = NV.lines[NV.i];
  NV.done = false;
  $("stText").textContent = "";
  $("stNext").style.visibility = "hidden";
  clearInterval(NV.typing);
  let i = 0;
  NV.typing = setInterval(() => {
    i++;
    $("stText").textContent = text.slice(0, i);
    if(i >= text.length){ clearInterval(NV.typing); nvReady(); }
  }, NV.n === 5 || NV.n === 0 ? 52 : 36);
  // 最後の一文で、その子は消える（救いの章では逆に、ゆっくり現れる）
  const last = NV.i === NV.lines.length - 1;
  if(NV.n === 5 && last) NV.want = 0.12;
  if(NV.n === 0) NV.want = Math.min(1, 0.25 + NV.i * 0.3);
}
function nvReady(){
  NV.done = true;
  $("stNext").style.visibility = "visible";
}
function nvAdvance(){
  if(NV.lock) return;
  if(!NV.done){                       // まだ出ている途中なら、全部出す
    clearInterval(NV.typing);
    $("stText").textContent = NV.lines[NV.i];
    nvReady(); return;
  }
  if(NV.i < NV.lines.length - 1){ NV.i++; nvLine(); return; }
  // 読み終わり
  $("stNext").style.visibility = "hidden";
  if(NV.n === 5 && !rescue[NV.key]){ $("stChoice").classList.remove("hide"); return; }
  closeStory();
}
function closeStory(){
  clearInterval(NV.typing); cancelAnimationFrame(NV.raf); storyMusic(false);

}

      ? `<small>第${n}章</small> ${STORY[bookLine].ch[n - 1].t}`
      : `<small>第${n}章</small> 🔒 第${n}段階まで育てると読める`;

      e.stopPropagation(); e.preventDefault();
      $("bookView").classList.add("hide"); openStory(bookLine, n);
    });
    list.appendChild(b);
  }
  const b = document.createElement("button");
  if(rescue[bookLine]){
    b.className = "chap";

}

}

$("mute").textContent = game.muted ? "🔇" : "🔊";

/* =========================================================
   描画
   ========================================================= */
/* ---------------------------------------------------------
   絵は Gemini に描いてもらったものを使う。
   配色も Gemini に決めてもらった（淡いラベンダーの洞窟＋暖色の地面）。
   --------------------------------------------------------- */
const COL = {
  wallTop:"#F5EEFF", wall:"#DACCFF", wallDeep:"#C6B2F2",
  brick:"#D2C2F8", brickLine:"#C0ACEE",
  rock:"#B8A0E6", rockDeep:"#9E84D0",
  ground:"#E0A370", groundTop:"#F0C494", groundShade:"#B37140", groundDeep:"#8E5A34",
  pit:"#5E4A86", pitDeep:"#3B2C5C",
  line:"#594236", ink:"#594236",
  mint:"#42E6E0", mintDeep:"#2CB3AD",
};

const IMG = {};
function loadImg(key, file){ const im = new Image(); im.src = "assets/" + file; IMG[key] = im; }
for(let i = 1; i <= 9; i++) loadImg("s" + i, "slime_0" + i + ".png");
loadImg("crystal", "prop_01.png"); loadImg("mushroom", "prop_02.png"); loadImg("bat", "prop_03.png");
loadImg("spike1", "obst_01.png");   // 一本だけのトゲ（端が切れていない完全な形）
loadImg("spike3", "obst_03.png");   // 三本並びのトゲ
loadImg("hang",   "obst_02.png");   // 天井から下がる岩 loadImg("sign",     "prop_05.png"); loadImg("chest", "prop_06.png");
const ready = im => im && im.complete && im.naturalWidth > 0;

// 中心x・接地y・高さを指定して絵を置く
function put(im, cx, baseY, h, alpha){
  if(!ready(im)) return false;
  const w = im.naturalWidth / im.naturalHeight * h;
  if(alpha != null) ctx.globalAlpha = alpha;
  ctx.drawImage(im, cx - w / 2, baseY - h, w, h);
  if(alpha != null) ctx.globalAlpha = 1;
  return true;
}

const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

const brick = (() => {
  const c = document.createElement("canvas"); c.width = 72; c.height = 36;
  const g = c.getContext("2d");
  g.fillStyle = COL.brickLine; g.fillRect(0, 0, 72, 36);
  g.fillStyle = COL.brick;
  g.fillRect(1.5, 1.5, 33, 15); g.fillRect(37.5, 1.5, 33, 15);
  g.fillRect(-16.5, 19.5, 33, 15); g.fillRect(19.5, 19.5, 33, 15); g.fillRect(55.5, 19.5, 33, 15);
  return c;
})();
let brickPat = null;

function drawBackground(cam){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, COL.wallTop); g.addColorStop(.5, COL.wall); g.addColorStop(1, COL.wallDeep);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if(!brickPat) brickPat = ctx.createPattern(brick, "repeat");
  ctx.save();
  ctx.globalAlpha = .55;
  ctx.translate(-((cam * 0.35) % 72), 0);
  ctx.fillStyle = brickPat; ctx.fillRect(0, bandTop - 30, W + 72, BAND + 60);
  ctx.restore();

  // 光るクリスタルとキノコ（洞窟を「暗い」ではなく「ファンタジー」に見せる）
  // 拍に合わせてふわっと明るくし、リズムを目でも分かるようにする
  const pulse = (game.mode === "play") ? beatPulse() : 0;
  if(pulse > 0.02){ ctx.fillStyle = `rgba(255,255,255,${pulse * 0.09})`; ctx.fillRect(0, 0, W, H); }

  // 飾りは「壁の模様」として上のほうにだけ置く。
  // 地面に置くと障害物と見分けがつかなくなるため、地面には一切置かない。
  const sp = 190, par = 0.5, base = cam * par;
  for(let i = Math.floor(base / sp) - 1; i < Math.floor((base + W) / sp) + 2; i++){
    const x = i * sp - base + 60 + hash(i) * 50;
    const kind = hash(i * 3.7) < .5;
    const y = bandTop + 34 + hash(i * 5.1) * 46;      // 壁の上のほうだけ
    const fl = .8 + .2 * Math.sin(game.time * 2.2 + i);
    const glow = ctx.createRadialGradient(x, y - 10, 2, x, y - 10, 62 * fl);
    glow.addColorStop(0, kind ? "rgba(150,240,255,.26)" : "rgba(255,180,215,.22)");
    glow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = glow; ctx.fillRect(x - 70, y - 80, 140, 140);
    if(kind) put(IMG.crystal, x, y + 2, 22 + hash(i * 2.2) * 7, .45);
    else     put(IMG.mushroom, x, y + 14, 18 + hash(i * 1.4) * 5, .45);
  }

  // 天井。ここを岩で埋めておかないと、上から下りてくる障害物が
  // 「宙に浮いた切り抜き」に見えてしまう
  const cg = ctx.createLinearGradient(0, 0, 0, bandTop + 7);
  cg.addColorStop(0, "#9C83D6"); cg.addColorStop(1, COL.rock);
  ctx.fillStyle = cg; ctx.fillRect(0, 0, W, bandTop + 7);
  ctx.fillStyle = "rgba(255,255,255,.07)";
  const rp = 46, q0 = Math.floor(cam * 0.25 / rp);
  for(let i = q0 - 1; i < q0 + Math.ceil(W / rp) + 2; i++){
    for(let j = 0; j < Math.ceil((bandTop + 8) / rp); j++){
      const cx2 = i * rp - cam * 0.25 + hash(i * 7 + j) * 26, cy2 = j * rp + hash(i + j * 13) * 26;
      if(cy2 > bandTop) continue;
      ctx.beginPath(); ctx.ellipse(cx2, cy2, 8 + hash(i + j) * 12, 5 + hash(i * j + 1) * 7, hash(j) * 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.fillStyle = COL.rockDeep;
  const sr = 44, r0 = Math.floor(cam / sr);
  for(let i = r0 - 1; i < r0 + Math.ceil(W / sr) + 2; i++){
    const x = i * sr - cam, h = 7 + hash(i) * 16, w = 14 + hash(i + 9) * 14;
    ctx.beginPath(); ctx.moveTo(x - w / 2, bandTop + 5); ctx.lineTo(x + w / 2, bandTop + 5);
    ctx.lineTo(x + hash(i + 3) * 4 - 2, bandTop + 5 + h); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = COL.line; ctx.globalAlpha = .45; ctx.fillRect(0, bandTop + 5, W, 2); ctx.globalAlpha = 1;
}

function drawGround(run){
  const cam = run.cam, top = GY;
  ctx.fillStyle = COL.ground;      ctx.fillRect(0, top, W, H - top);
  ctx.fillStyle = COL.groundTop;   ctx.fillRect(0, top, W, 8);
  ctx.fillStyle = COL.groundShade; ctx.fillRect(0, top + 8, W, 5);
  // 縦持ちだと地面が広く見えるので、奥へ向かって暗くし、石を散らして平らに見せない
  const gd = ctx.createLinearGradient(0, top + 40, 0, H);
  gd.addColorStop(0, COL.groundDeep); gd.addColorStop(1, "#6E4224");
  ctx.fillStyle = gd; ctx.fillRect(0, top + 40, W, H - top - 40);
  const st = 58, s0 = Math.floor(cam / st);
  for(let i = s0 - 1; i < s0 + Math.ceil(W / st) + 2; i++){
    for(let j = 0; j < Math.ceil((H - top - 40) / st); j++){
      const sx = i * st - cam + hash(i * 3.3 + j) * 34;
      const sy = top + 52 + j * st + hash(i + j * 7.1) * 26;
      if(sy > H) continue;
      ctx.fillStyle = hash(i * j + 5) < .5 ? "rgba(255,255,255,.055)" : "rgba(0,0,0,.075)";
      ctx.beginPath();
      ctx.ellipse(sx, sy, 5 + hash(i + j) * 7, 3 + hash(i * 2 + j) * 4, hash(j) * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.fillStyle = COL.line; ctx.globalAlpha = .55; ctx.fillRect(0, top - 2, W, 3); ctx.globalAlpha = 1;

  ctx.fillStyle = "rgba(142,90,52,.35)";
  const bw = 46, b0 = Math.floor(cam / bw);
  for(let i = b0; i < b0 + Math.ceil(W / bw) + 1; i++){
    const x = i * bw - cam;
    ctx.fillRect(x, top + 13, 2, 16);
    ctx.fillRect(x + 23, top + 29, 2, 11);
  }

  // 穴（真っ黒にせず、紫のグラデにきらきらを浮かべる）
  for(const p of run.pits){
    const x0 = p.x0 - cam, x1 = p.x1 - cam;
    if(x1 < -10 || x0 > W + 10) continue;
    const g = ctx.createLinearGradient(0, top, 0, top + 120);
    g.addColorStop(0, COL.pit); g.addColorStop(1, COL.pitDeep);
    ctx.fillStyle = g; ctx.fillRect(x0, top, x1 - x0, H - top);
    ctx.fillStyle = COL.line; ctx.globalAlpha = .5;
    ctx.fillRect(x0 - 2, top - 2, 3, 16); ctx.fillRect(x1 - 1, top - 2, 3, 16);
    ctx.globalAlpha = 1;
    for(let k = 0; k < 5; k++){
      const sx = x0 + hash(Math.round(p.x0) + k) * (x1 - x0);
      const sy = top + 16 + ((game.time * 16 + hash(k * 7.7 + p.x0) * 90) % 90);
      ctx.globalAlpha = .55 * (1 - (sy - top) / 110);
      ctx.fillStyle = "#FFF3B0";
      ctx.beginPath(); ctx.arc(sx, sy, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function roundRect(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawSigns(run){
  const cam = run.cam;
  const f0 = Math.floor(cam / (FLOOR_M * PX_PER_M));
  for(let f = f0; f <= f0 + 1; f++){
    if(f < 1) continue;
    const x = f * FLOOR_M * PX_PER_M - cam + PX;
    if(x < -40 || x > W + 40) continue;
    // 地面に置くと障害物に見えるので、天井から吊るす看板にする
    const sy = bandTop + 10, bw = 62, bh = 26;
    ctx.strokeStyle = "#8A6A40"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x - bw / 2 + 8, sy); ctx.lineTo(x - bw / 2 + 11, sy + 12);
    ctx.moveTo(x + bw / 2 - 8, sy); ctx.lineTo(x + bw / 2 - 11, sy + 12);
    ctx.stroke();
    ctx.fillStyle = "#F1E8D4"; roundRect(x - bw / 2, sy + 12, bw, bh, 7); ctx.fill();
    ctx.strokeStyle = COL.line; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = COL.ink; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(`地下${f + 1}階`, x, sy + 12 + bh / 2 + 1);
  }
  // 前に力つきた場所。目印があると「今日はここを越える」になる
  if(game.lastDeath > 3 && game.mode !== "title" && Math.abs(game.lastDeath - game.bestDist) > 1){
    const x = game.lastDeath * PX_PER_M - cam + PX;
    if(x > -40 && x < W + 40){
      ctx.lineCap = "round"; ctx.lineWidth = 3; ctx.strokeStyle = "#8A6A40";
      ctx.beginPath(); ctx.moveTo(x, GY + 1); ctx.lineTo(x, GY - 30); ctx.stroke();
      ctx.lineCap = "butt";
      ctx.fillStyle = "#EFE6FA"; roundRect(x, GY - 30, 22, 14, 3); ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = COL.line; ctx.stroke();
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.font = "900 10px sans-serif"; ctx.lineWidth = 3; ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(255,255,255,.92)"; ctx.strokeText("ここまで", x + 2, GY - 38);
      ctx.fillStyle = "#9A8ABC"; ctx.fillText("ここまで", x + 2, GY - 38);
    }
  }
  // ベスト記録の place：宝箱を置く
  if(game.bestDist > 5 && game.mode !== "title"){
    const x = game.bestDist * PX_PER_M - cam + PX;
    if(x > -40 && x < W + 40){
      const bob = Math.sin(game.time * 3) * 2;
      put(IMG.chest, x, GY + 2 + bob, 34);
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.font = "900 11px sans-serif";
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.9)";
      ctx.strokeText("BEST", x, GY - 40 + bob);
      ctx.fillStyle = "#C98016"; ctx.fillText("BEST", x, GY - 40 + bob);
    }
  }
}

function drawObstacles(run){
  const cam = run.cam;
  for(const o of run.obs){
    const x = o.x - cam;
    if(x < -140 || x > W + 60) continue;
    if(o.k === "spike"){
      const three = o.w >= 45 && ready(IMG.spike3);
      if(three){
        const h = o.w * IMG.spike3.naturalHeight / IMG.spike3.naturalWidth;
        ctx.drawImage(IMG.spike3, x, GY + 2 - h, o.w, h);
      }else if(ready(IMG.spike1)){
        const h = o.w * IMG.spike1.naturalHeight / IMG.spike1.naturalWidth;
        ctx.drawImage(IMG.spike1, x, GY + 2 - h, o.w, h);
      }else{
        ctx.fillStyle = "#FF5A73";
        ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x + o.w / 2, GY - 22); ctx.lineTo(x + o.w, GY); ctx.closePath(); ctx.fill();
      }
    }else if(o.k === "ceil"){
      const bottom = GY + CEIL_BOTTOM;
      const hangH = ready(IMG.hang)
        ? Math.min(bottom - bandTop, o.w * IMG.hang.naturalHeight / IMG.hang.naturalWidth)
        : 40;
      // 天井から岩の絵までを、同じ色の柱でつないで「天井から下がっている」ように見せる
      const top = bandTop - 40, colBottom = bottom - hangH + 6;
      const g = ctx.createLinearGradient(0, top, 0, colBottom);
      g.addColorStop(0, "#9C83D6"); g.addColorStop(1, "#8E74C8");
      ctx.fillStyle = g; ctx.fillRect(x, top, o.w, colBottom - top);
      ctx.strokeStyle = COL.line; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + 1.5, bandTop + 4); ctx.lineTo(x + 1.5, colBottom);
      ctx.moveTo(x + o.w - 1.5, bandTop + 4); ctx.lineTo(x + o.w - 1.5, colBottom); ctx.stroke();
      // 上端の横線が出ないよう、天井の岩に溶かす
      const fade = ctx.createLinearGradient(0, bandTop - 42, 0, bandTop + 6);
      fade.addColorStop(0, COL.rock); fade.addColorStop(1, "rgba(184,160,230,0)");
      ctx.fillStyle = fade; ctx.fillRect(x - 3, bandTop - 42, o.w + 6, 48);
      if(ready(IMG.hang)) ctx.drawImage(IMG.hang, x, bottom - hangH, o.w, hangH);
      // 足元に影を落として、どこにあるかを地面の上でも分かるようにする
      ctx.fillStyle = "rgba(89,66,54,.16)"; ctx.fillRect(x, GY - 4, o.w, 4);
    }else if(o.k === "bat"){
      const by = GY + o.y + Math.sin(o.x * 0.05) * 6;
      const flap = 1 + Math.sin(game.time * 14 + o.x) * 0.12;
      if(ready(IMG.bat)){
        const h = 30, w = IMG.bat.naturalWidth / IMG.bat.naturalHeight * h * flap;
        ctx.drawImage(IMG.bat, x - w / 2, by - h / 2, w, h);
      }else{
        ctx.fillStyle = "#6E5080"; ctx.beginPath(); ctx.arc(x, by, 11, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}

/* ---------------------------------------------------------
   進化した姿。
   体は Gemini に描いてもらったスライムの絵を色だけ塗りかえて使い、
   耳・しっぽ・かんむりなどの飾りをその場で描き足す。
   （15通りの絵を用意しなくても、段階ごとに別人に見える）
   --------------------------------------------------------- */
const TINT = {};
function tinted(im, col){
  if(!ready(im)) return null;
  const key = im.src + col;
  if(TINT[key]) return TINT[key];
  const c = document.createElement("canvas");
  c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext("2d");
  g.drawImage(im, 0, 0);
  g.globalCompositeOperation = "color";        // 色みだけ差し替え、陰影はそのまま残す
  g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = "destination-in";
  g.drawImage(im, 0, 0);                        // はみ出した色を絵の形で切り抜く
  TINT[key] = c;
  return c;
}

function star(g, x, y, R1, R2, n){
  g.beginPath();
  for(let i = 0; i < n * 2; i++){
    const a = -Math.PI / 2 + i * Math.PI / n, r = i % 2 ? R2 : R1;
    if(i) g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else  g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  g.closePath();
}

/* 飾り。P = { g, cx, top, w, hh, baseY, ink, acc, col, t }
   back:true はからだの後ろに描く */

// f = { line, stage }。cx＝中心、baseY＝足もと、h＝基準の高さ
function drawCreature(g, f, cx, baseY, h, opt = {}){
  const im = opt.im || IMG.s1;
  const t  = opt.t != null ? opt.t : game.time;
  const sx = opt.sx != null ? opt.sx : 1, sy = opt.sy != null ? opt.sy : 1;
  const H0 = h * SIZE_UP[f.stage - 1];
  const w0 = ready(im) ? im.naturalWidth / im.naturalHeight * H0 : H0;
  const w  = w0 * sx, hh = H0 * sy, top = baseY - hh;
  const P = { g, cx, top, w, hh, baseY, t, ink: COL.line, acc: LINE_INFO[f.line].acc, col: bodyCol(f) };
  const parts = LINE_PARTS[f.line][f.stage - 1];
  for(const k of parts) if(PART[k].back) PART[k].draw(P);
  const src = f.stage === 1 ? im : (tinted(im, bodyCol(f)) || im);
  if(ready(im)) g.drawImage(src, cx - w / 2, top, w, hh);
  else { g.fillStyle = bodyCol(f); g.beginPath(); g.ellipse(cx, baseY - hh / 2, w / 2, hh / 2, 0, 0, 7); g.fill(); }
  for(const k of parts) if(!PART[k].back) PART[k].draw(P);
}

// そだてる画面に出す小さい姿
function formThumb(line, stage, size){
  const c = document.createElement("canvas");
  const d = Math.min(2, window.devicePixelRatio || 1);
  c.width = size * d; c.height = size * d;
  c.style.width = size + "px"; c.style.height = size + "px";
  const g = c.getContext("2d"); g.scale(d, d);
  const paint = () => {
    g.clearRect(0, 0, size, size);
    g.fillStyle = "#F3ECFF"; g.beginPath(); g.arc(size / 2, size / 2, size / 2 - 1, 0, 7); g.fill();
    g.save(); g.beginPath(); g.arc(size / 2, size / 2, size / 2 - 1, 0, 7); g.clip();
    drawCreature(g, { line, stage }, size / 2, size * 0.90, size * 0.44, { im: IMG.s1, t: 1.1 });
    g.restore();
  };
  paint();
  if(!ready(IMG.s1)) IMG.s1.addEventListener("load", paint, { once: true });
  return c;
}

// 動きに合わせて絵を選ぶ（伸び・まん丸・落下・つぶれ）
function slimePose(P){
  if(game.mode === "dead") return IMG.s9;
  if(!P.onGround){
    if(P.vy < -250) return IMG.s3;
    if(P.vy <  130) return IMG.s4;
    return IMG.s5;
  }
  return game.squashT > 0 ? IMG.s7 : IMG.s1;   // s2は足が生えているので使わない
}
const POSE_H = { s1:40, s3:54, s4:40, s5:44, s7:26, s9:38 };

function drawSlime(run){
  const P = run.P;
  if(game.mode === "dead") return;
  const x = PX, baseY = GY + P.y + R;

  // 地面にいる間は「ぽよんぽよん」と跳ねて見せる。
  // 当たり判定は動かさない（本当に跳ばせるとトゲを勝手に飛び越えてしまうため）。
  // 跳ねる高さはトゲ（22px）を越えて見えない範囲に抑える。
  let hop = 0, sx = 1, sy = 1;
  if(P.onGround && !P.fallen && game.squashT <= 0){
    const s = Math.abs(Math.sin(game.time / 0.34 * Math.PI));
    hop = -s * 9;
    sx = 1 + (1 - s) * 0.17;   // 着地の瞬間は横に潰れる
    sy = 1 - (1 - s) * 0.17;
  }

  if(!P.fallen){
    const hgt = Math.max(0, -P.y - R) - hop;
    ctx.fillStyle = `rgba(89,66,54,${0.26 * Math.max(0.15, 1 - hgt / 130)})`;
    ctx.beginPath(); ctx.ellipse(x, GY + 3, R * (1 - Math.min(0.5, hgt / 240)), 3.5, 0, 0, Math.PI * 2); ctx.fill();
  }

  if(run.inv > 0 && Math.floor(game.time * 12) % 2 === 0) return;   // 無敵の間は点滅
  const im = slimePose(P);
  const key = Object.keys(IMG).find(k => IMG[k] === im);
  drawCreature(ctx, pet, x, baseY + 3 + hop, POSE_H[key] || 40, { im, sx, sy });
}

/* ---- 落ちているクリスタル ---- */
function drawGems(run){
  for(const q of run.gems){
    if(q.got) continue;
    const x = q.x - run.cam;
    if(x < -30 || x > W + 30) continue;
    const bob = Math.sin(game.time * 3 + q.x * 0.03) * 3;
    const y = GY + q.y + bob;
    // 光の輪。障害物と見まちがえないよう、拾えるものはふわっと光らせる
    const gr = ctx.createRadialGradient(x, y, 2, x, y, 17);
    gr.addColorStop(0, "rgba(180,245,255,.75)"); gr.addColorStop(1, "rgba(180,245,255,0)");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, 17, 0, 7); ctx.fill();
    if(ready(IMG.crystal)){
      const h = 24, w = IMG.crystal.naturalWidth / IMG.crystal.naturalHeight * h;
      ctx.drawImage(IMG.crystal, x - w / 2, y - h / 2, w, h);
    }else{
      ctx.fillStyle = "#7FE6FF";
      ctx.beginPath(); ctx.moveTo(x, y - 11); ctx.lineTo(x + 8, y); ctx.lineTo(x, y + 11); ctx.lineTo(x - 8, y); ctx.closePath();
      ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COL.line; ctx.stroke();
    }
  }
}

/* ---- おうち（タイトル画面）---- */
function drawHome(){
  const cx = W / 2, baseY = GY + 2;
  // すわり心地のよさそうな座ぶとん
  ctx.fillStyle = "rgba(89,66,54,.2)";
  ctx.beginPath(); ctx.ellipse(cx, baseY + 4, 56, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#F6C8E2";
  ctx.beginPath(); ctx.ellipse(cx, baseY - 4, 52, 15, 0, 0, 7); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = COL.line; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.ellipse(cx - 12, baseY - 9, 20, 5, 0, 0, 7); ctx.fill();
  put(IMG.mushroom, cx - 118, GY + 2, 30);
  put(IMG.crystal,  cx + 122, GY + 2, 26);
  // この子がこれまでに運んできたぶんが、おうちに積もっていく
  const pile = Math.min(18, Math.floor(pet.total / 18));
  for(let i = 0; i < pile; i++){
    const sd = i % 2 ? 1 : -1, a = hash(i * 3.7 + 1), b = hash(i * 9.1 + 2);
    put(IMG.crystal, cx + sd * (58 + a * 104), GY + 5 + b * 28, 13 + b * 8);
  }
  if(pile >= 18) put(IMG.chest, cx - 150, GY + 26, 30);

  // ふだんはのんびり跳ねている。なでると大きくはずむ
  const happy = Math.max(0, game.petHappy);
  const sp = happy > 0 ? 0.20 : 0.42;
  const k = Math.abs(Math.sin(game.time / sp * Math.PI));
  const hop = -k * (happy > 0 ? 26 : 10);
  const sx = 1 + (1 - k) * 0.15, sy = 1 - (1 - k) * 0.15;
  drawCreature(ctx, pet, cx, baseY - 6 + hop, 62, { im: IMG.s1, sx, sy });

  if(game.evoT > 0){
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, game.evoT * 0.8)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawPops(dt){
  for(const p of game.pops){
    p.t += dt;
    const k = p.t / 0.75;
    ctx.globalAlpha = Math.max(0, 1 - k);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.font = `900 ${16 + (1 - k) * 6}px sans-serif`;
    ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(255,255,255,.95)";
    const y = GY - 66 - k * 34;
    ctx.strokeText(p.text, PX + 26, y); ctx.fillStyle = p.col; ctx.fillText(p.text, PX + 26, y);
  }
  ctx.globalAlpha = 1;
  game.pops = game.pops.filter(p => p.t < 0.75);
}

function drawParticles(dt){
  for(const p of game.parts){
    p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  game.parts = game.parts.filter(p => p.t < p.life);
}

function label(text, x, y, size, col){
  ctx.font = `900 ${size}px sans-serif`;
  ctx.lineWidth = Math.max(3, size * 0.22); ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(255,255,255,.92)"; ctx.strokeText(text, x, y);
  ctx.fillStyle = col; ctx.fillText(text, x, y);
}

function drawHUD(run){
  if(game.mode === "title" || game.mode === "dead") return;
  // 拾ったクリスタル
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  label(`💎 ${game.runGems}`, 12, 12, 17, "#2E7C9E");
  const m = run.cam / PX_PER_M;
  const roomy = bandTop > 110;
  const y = roomy ? bandTop - 96 : 12;
  ctx.textBaseline = "top";
  ctx.textAlign = roomy ? "center" : "left";
  const hx = roomy ? W / 2 : 12;
  // 階層が上がった瞬間は、この表示自体を大きく金色にして知らせる
  // （別の場所に文字を出すと、HUDや遊ぶ帯と重なって読みにくくなる）
  const fl = Math.max(0, Math.min(1, game.floorFlash));
  label(`地下 ${floorOf(m)} 階`, hx, y - fl * 4, (roomy ? 34 : 20) * (1 + 0.3 * fl), fl > 0.02 ? "#C98016" : "#5B4A86");
  label(`${Math.floor(m)} m`, hx, y + (roomy ? 42 : 24), roomy ? 20 : 13, "#7A68A8");
  if(game.bonus > 0){
    label(`リズム ＋${game.bonus}`, hx, y + (roomy ? 70 : 40), roomy ? 16 : 12, "#C98016");
  }
  if(game.best > 0){
    const by = y + (roomy ? (game.bonus ? 96 : 70) : 5);
    if(roomy) label(`BEST ${Math.floor(game.best)}`, hx, by, 13, "#9A8ABC");
    else { ctx.textAlign = "right"; label(`BEST ${Math.floor(game.best)}`, W - 58, by, 12, "#9A8ABC"); }
  }
  if(game.combo >= 2){
    ctx.textAlign = "center";
    const k = Math.min(1, game.combo / 20);
    label(`${game.combo} コンボ`, W / 2, bandTop + 38, 22 + k * 8, "#FF7A9C");
  }
}

/* ---- ループ ---- */
let last = performance.now(), acc = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  game.time += dt;
  const run = game.run;

  if(game.mode === "play"){
    acc += dt;
    while(acc >= STEP){
      stepRun(run, STEP);
      acc -= STEP;
      for(const e of run.ev){
        if(e === "jump" || e === "jump2"){
          if(e === "jump"){ SFX.jump(); burst(PX, GY, 6, "rgba(255,255,255,.85)", 90); }
          else { SFX.jump2(); burst(PX, GY + run.P.y + R, 10, "#B8F7F4", 150); }
          const j = judgeBeat();
          if(j === "PERFECT"){
            game.combo++; game.bestCombo = Math.max(game.bestCombo, game.combo);
            game.bonus += Math.round((2 + Math.min(8, Math.floor(game.combo / 5))) * perk("rhythm"));
            game.pops.push({ text: game.combo >= 2 ? `PERFECT ${game.combo}` : "PERFECT", col: "#FFB300", t: 0 });
            at(1320, actx.currentTime, .12, "square", .09, { echo: true });
            burst(PX, GY + run.P.y, 10, "#FFD13B", 170);
          }else if(j === "GOOD"){
            game.bonus += 1;
            game.pops.push({ text: "GOOD", col: "#3FA9E0", t: 0 });
          }else{
            game.combo = 0;
          }
        }
        else if(e === "land"){ SFX.land(); game.squashT = 0.12; burst(PX, GY, 5, "rgba(255,255,255,.8)", 70); }
        else if(e === "gem"){
          game.runGems++; SFX.gem();
          burst(PX, GY + run.P.y, 8, "#9EEFFF", 160, 40);
        }
      }
      run.ev.length = 0;
      if(run.P.dead){ die(); break; }
    }
    const md = run.cam / PX_PER_M;
    if(game.lastDeath > 3 && !game.passedDeath && md > game.lastDeath){
      game.passedDeath = true;
      game.pops.push({ text: "まえを こえた！", col: "#FF7A9C", t: 0 });
      SFX.floor();
    }
    const f = floorOf(run.cam / PX_PER_M);
    if(f > game.lastFloor){ game.lastFloor = f; game.floorFlash = 1.2; SFX.floor(); }
  }else{
    acc = 0;
  }
  if(game.floorFlash > 0) game.floorFlash -= dt;
  if(game.petHappy > 0) game.petHappy -= dt;
  if(game.evoT > 0) game.evoT -= dt * 1.6;
  if(game.squashT > 0) game.squashT -= dt;
  if(game.shake > 0) game.shake = Math.max(0, game.shake - dt * 40);

  // 描画
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#C6B2F2"; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = (Math.random() - 0.5) * game.shake, sy = (Math.random() - 0.5) * game.shake;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx * scale), dpr * sy * scale);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawBackground(run.cam);
  drawGround(run);
  drawSigns(run);
  drawObstacles(run);
  drawGems(run);
  if(game.mode === "title") drawHome(); else drawSlime(run);
  drawParticles(dt);
  drawPops(dt);
  // 左右のふちを暗く
  const edge = ctx.createLinearGradient(0, 0, W, 0);
  edge.addColorStop(0, "rgba(90,70,120,.18)"); edge.addColorStop(.1, "rgba(0,0,0,0)"); edge.addColorStop(.9, "rgba(0,0,0,0)"); edge.addColorStop(1, "rgba(90,70,120,.18)");
  ctx.fillStyle = edge; ctx.fillRect(0, 0, W, H);
  drawHUD(run);
  ctx.restore();

  requestAnimationFrame(frame);
}

showTitle();
requestAnimationFrame(frame);
</script>
